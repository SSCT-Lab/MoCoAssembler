api: torch.nn.AdaptiveMaxPool3d(output_size, return_indices=False)
constraints:
  output_size:
    dtype: int
    structure:
    - integer
    - tuple
    shape: 3
    range: [1, 42024]
  return_indices:
    default: False
    dtype: torch.bool
descp: 'r"""Applies a 3D adaptive max pooling over an input signal composed of several
  input planes.

  The output is of size :math:`D_{out} \times H_{out} \times W_{out}`, for any input
  size.

  The number of output features is equal to the number of input planes.

  Args:

  output_size: the target output size of the image of the form :math:`D_{out} \times
  H_{out} \times W_{out}`.

  Can be a tuple :math:`(D_{out}, H_{out}, W_{out})` or a single

  :math:`D_{out}` for a cube :math:`D_{out} \times D_{out} \times D_{out}`.

  :math:`D_{out}`, :math:`H_{out}` and :math:`W_{out}` can be either a

  ``int``, or ``None`` which means the size will be the same as that of the input.

  return_indices: if ``True``, will return the indices along with the outputs.

  Useful to pass to nn.MaxUnpool3d. Default: ``False``

  Shape:

  - Input: :math:`(N, C, D_{in}, H_{in}, W_{in})` or :math:`(C, D_{in}, H_{in}, W_{in})`.

  - Output: :math:`(N, C, D_{out}, H_{out}, W_{out})` or :math:`(C, D_{out}, H_{out},
  W_{out})`,

  where :math:`(D_{out}, H_{out}, W_{out})=\text{output\_size}`.

  Examples:

  >>> # target output size of 5x7x9

  >>> m = nn.AdaptiveMaxPool3d((5, 7, 9))

  >>> input = torch.randn(1, 64, 8, 9, 10)

  >>> output = m(input)

  >>> # target output size of 7x7x7 (cube)

  >>> m = nn.AdaptiveMaxPool3d(7)

  >>> input = torch.randn(1, 64, 10, 9, 8)

  >>> output = m(input)

  >>> # target output size of 7x9x8

  >>> m = nn.AdaptiveMaxPool3d((7, None, None))

  >>> input = torch.randn(1, 64, 10, 9, 8)

  >>> output = m(input)

  '
inputs:
  optional:
  - return_indices
  required:
  - output_size
