api: torch.nn.LazyConv1d(out_channels, kernel_size, stride=1, padding=0, dilation=1,
  groups=1, bias=True, padding_mode='zeros', device=None, dtype=None)
constraints:
  bias:
    default: 'True'
    descp: If True, adds a learnable bias to the output.
    dtype:
    - bool
  dilation:
    default: '1'
    descp: Spacing between kernel elements.
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
    - tuple
  groups:
    default: '1'
    descp: Number of blocked connections from input channels to output channels.
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
  kernel_size:
    descp: Size of the convolving kernel
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
    - tuple
  out_channels:
    descp: Number of channels produced by the convolution
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
  padding:
    default: '0'
    descp: Zero-padding added to both sides of the input.
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
    - tuple
  padding_mode:
    default: zeros
    descp: zeros, reflect, replicate or circular.
    dtype:
    - str
    enum: null
  stride:
    default: '1'
    descp: Stride of the convolution.
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
    - tuple
descp: A torch.nn.Conv1d module with lazy initialization of the in_channels argument
  of the Conv1d that is inferred from the input.size(1). The attributes that will
  be lazily initialized are weight and bias.
inputs:
  optional:
  - stride
  - padding
  - padding_mode
  - dilation
  - groups
  - bias
  required:
  - out_channels
  - kernel_size
