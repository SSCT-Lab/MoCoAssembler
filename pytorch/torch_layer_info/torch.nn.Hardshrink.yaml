api: torch.nn.Hardshrink(lambd=0.5)
constraints:
  lambd:
    default: 0.5
    dtype: torch.float
descp: 'r"""Applies the Hard Shrinkage (Hardshrink) function element-wise.

  Hardshrink is defined as:

  .. math::

  \text{HardShrink}(x) =

  \begin{cases}

  x, & \text{ if } x > \lambda \\

  x, & \text{ if } x < -\lambda \\

  0, & \text{ otherwise }

  \end{cases}

  Args:

  lambd: the :math:`\lambda` value for the Hardshrink formulation. Default: 0.5

  Shape:

  - Input: :math:`(*)`, where :math:`*` means any number of dimensions.

  - Output: :math:`(*)`, same shape as the input.

  .. image:: ../scripts/activation_images/Hardshrink.png

  Examples::

  >>> m = nn.Hardshrink()

  >>> input = torch.randn(2)

  >>> output = m(input)

  '
inputs:
  optional:
  - lambd
  required: []
