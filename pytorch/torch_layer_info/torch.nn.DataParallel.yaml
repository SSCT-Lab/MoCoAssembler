api: torch.nn.DataParallel(module, device_ids=None, output_device=None, dim=0)
constraints:
  device_ids:
    descp: 'CUDA devices (default: all devices)'
    dtype:
    - list of python:int or torch.device
    - list of python:int or torch.device
    structure:
    - list
  module:
    descp: module to be parallelized
    dtype:
    - module
  output_device:
    descp: 'device location of output (default: device_ids[0])'
    dtype:
    - int
    - int or torch.device
    range: null
    shape: null
    structure:
    - single
descp: Implements data parallelism at the module level.
inputs:
  optional: []
  required:
  - module
  - device_ids
  - output_device
