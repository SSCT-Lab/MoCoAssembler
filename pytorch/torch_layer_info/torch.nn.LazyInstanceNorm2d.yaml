api: torch.nn.LazyInstanceNorm2d(eps=1e-05, momentum=0.1, affine=True, track_running_stats=True,
  device=None, dtype=None)
constraints:
  affine:
    default: False.
    descp: a boolean value that when set to True, this module has learnable affine
      parameters, initialized the same way as done for batch normalization.
    dtype:
    - bool
  eps:
    default: 1e-5
    descp: a value added to the denominator for numerical stability.
    dtype:
    - float
    shape: null
    structure:
    - single
  momentum:
    default: '0.1'
    descp: the value used for the running_mean and running_var computation.
    dtype:
    - float
    shape: null
    structure:
    - single
  num_features:
    descp: CCC from an expected input of size (N,C,H,W)(N, C, H, W)(N,C,H,W) or (C,H,W)(C,
      H, W)(C,H,W)
  track_running_stats:
    default: 'False'
    descp: a boolean value that when set to True, this module tracks the running mean
      and variance, and when set to False, this module does not track such statistics
      and always uses batch statistics in both training and eval modes.
    dtype:
    - bool
descp: A torch.nn.InstanceNorm2d module with lazy initialization of the num_features
  argument of the InstanceNorm2d that is inferred from the input.size(1). The attributes
  that will be lazily initialized are weight, bias, running_mean and running_var.
inputs:
  optional: []
  required:
  - num_features
  - eps
  - momentum
  - affine
  - track_running_stats
