api: torch.nn.LazyConvTranspose2d(out_channels, kernel_size, stride=1, padding=0,
  output_padding=0, groups=1, bias=True, dilation=1, padding_mode='zeros', device=None,
  dtype=None)
constraints:
  bias:
    default: 'True'
    descp: If True, adds a learnable bias to the output.
    dtype:
    - bool
  dilation:
    default: '1'
    descp: Spacing between kernel elements.
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
    - tuple
  groups:
    default: '1'
    descp: Number of blocked connections from input channels to output channels.
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
  kernel_size:
    descp: Size of the convolving kernel
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
    - tuple
  out_channels:
    descp: Number of channels produced by the convolution
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
  output_padding:
    default: '0'
    descp: Additional size added to one side of each dimension in the output shape.
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
    - tuple
  padding:
    default: '0'
    descp: dilation * (kernel_size - 1) - padding zero-padding will be added to both
      sides of each dimension in the input.
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
    - tuple
  stride:
    default: '1'
    descp: Stride of the convolution.
    dtype:
    - int
    range: null
    shape: null
    structure:
    - single
    - tuple
descp: A torch.nn.ConvTranspose2d module with lazy initialization of the in_channels
  argument of the ConvTranspose2d that is inferred from the input.size(1). The attributes
  that will be lazily initialized are weight and bias.
inputs:
  optional:
  - stride
  - padding
  - output_padding
  - groups
  - bias
  - dilation
  required:
  - out_channels
  - kernel_size
