api: torch.nn.PairwiseDistance(p=2.0, eps=1e-06, keepdim=False)
constraints:
  eps:
    default: 1e-6
    descp: Small value to avoid division by zero.
    dtype:
    - float
    shape: null
    structure:
    - single
  keepdim:
    default: 'False'
    descp: Determines whether or not to keep the vector dimension.
    dtype:
    - bool
  p:
    default: '2'
    descp: the norm degree. Can be negative.
    dtype:
    - real, optional
descp: Computes the pairwise distance between input vectors, or between columns of
  input matrices.
inputs:
  optional:
  - p
  - eps
  - keepdim
  required: []
