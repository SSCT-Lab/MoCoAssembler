api: torch.nn.RNNCell(input_size, hidden_size, bias=True, nonlinearity='tanh', device=None,
  dtype=None)
constraints:
  bias:
    default: 'True'
    dtype:
    - torch.bool
  hidden_size:
    dtype:
    - int
    range: '[0,inf)'
  input_size:
    dtype:
    - int
    range: '[0,inf)'
  nonlinearity:
    default: tanh
    dtype:
    - enum[string]
    range:
    - tanh
    - relu
descp: 'r"""An Elman RNN cell with tanh or ReLU non-linearity.

  .. math::

  h'' = \tanh(W_{ih} x + b_{ih}  +  W_{hh} h + b_{hh})

  If :attr:`nonlinearity` is `''relu''`, then ReLU is used in place of tanh.

  Args:

  input_size: The number of expected features in the input `x`

  hidden_size: The number of features in the hidden state `h`

  bias: If ``False``, then the layer does not use bias weights `b_ih` and `b_hh`.

  Default: ``True``

  nonlinearity: The non-linearity to use. Can be either ``''tanh''`` or ``''relu''``.
  Default: ``''tanh''``

  Inputs: input, hidden

  - **input**: tensor containing input features

  - **hidden**: tensor containing the initial hidden state

  Defaults to zero if not provided.

  Outputs: h''

  - **h''** of shape `(batch, hidden_size)`: tensor containing the next hidden state

  for each element in the batch

  Shape:

  - input: :math:`(N, H_{in})` or :math:`(H_{in})` tensor containing input features
  where

  :math:`H_{in}` = `input_size`.

  - hidden: :math:`(N, H_{out})` or :math:`(H_{out})` tensor containing the initial
  hidden

  state where :math:`H_{out}` = `hidden_size`. Defaults to zero if not provided.

  - output: :math:`(N, H_{out})` or :math:`(H_{out})` tensor containing the next hidden
  state.

  Attributes:

  weight_ih: the learnable input-hidden weights, of shape

  `(hidden_size, input_size)`

  weight_hh: the learnable hidden-hidden weights, of shape

  `(hidden_size, hidden_size)`

  bias_ih: the learnable input-hidden bias, of shape `(hidden_size)`

  bias_hh: the learnable hidden-hidden bias, of shape `(hidden_size)`

  .. note::

  All the weights and biases are initialized from :math:`\mathcal{U}(-\sqrt{k}, \sqrt{k})`

  where :math:`k = \frac{1}{\text{hidden\_size}}`

  Examples::

  >>> rnn = nn.RNNCell(10, 20)

  >>> input = torch.randn(6, 3, 10)

  >>> hx = torch.randn(3, 20)

  >>> output = []

  >>> for i in range(6):

  ...     hx = rnn(input[i], hx)

  ...     output.append(hx)

  '
inputs:
  optional:
  - bias
  - nonlinearity
  required:
  - input_size
  - hidden_size
