api: torch.nn.AdaptiveMaxPool2d(output_size, return_indices=False)
constraints:
  output_size:
    dtype: int
    structure:
    - integer
    - tuple
    shape: 2
    range:
  return_indices:
    default: False
    dtype: torch.bool
descp: 'r"""Applies a 2D adaptive max pooling over an input signal composed of several
  input planes.

  The output is of size :math:`H_{out} \times W_{out}`, for any input size.

  The number of output features is equal to the number of input planes.

  Args:

  output_size: the target output size of the image of the form :math:`H_{out} \times
  W_{out}`.

  Can be a tuple :math:`(H_{out}, W_{out})` or a single :math:`H_{out}` for a

  square image :math:`H_{out} \times H_{out}`. :math:`H_{out}` and :math:`W_{out}`

  can be either a ``int``, or ``None`` which means the size will be the same as that

  of the input.

  return_indices: if ``True``, will return the indices along with the outputs.

  Useful to pass to nn.MaxUnpool2d. Default: ``False``

  Shape:

  - Input: :math:`(N, C, H_{in}, W_{in})` or :math:`(C, H_{in}, W_{in})`.

  - Output: :math:`(N, C, H_{out}, W_{out})` or :math:`(C, H_{out}, W_{out})`, where

  :math:`(H_{out}, W_{out})=\text{output\_size}`.

  Examples:

  >>> # target output size of 5x7

  >>> m = nn.AdaptiveMaxPool2d((5, 7))

  >>> input = torch.randn(1, 64, 8, 9)

  >>> output = m(input)

  >>> # target output size of 7x7 (square)

  >>> m = nn.AdaptiveMaxPool2d(7)

  >>> input = torch.randn(1, 64, 10, 9)

  >>> output = m(input)

  >>> # target output size of 10x7

  >>> m = nn.AdaptiveMaxPool2d((None, 7))

  >>> input = torch.randn(1, 64, 10, 9)

  >>> output = m(input)

  '
inputs:
  optional:
  - return_indices
  required:
  - output_size
