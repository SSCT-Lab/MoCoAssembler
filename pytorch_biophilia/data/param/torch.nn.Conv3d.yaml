descp: '__doc__ = r"""Applies a 3D convolution over an input signal composed of several
  input

  planes.

  In the simplest case, the output value of the layer with input size :math:`(N, C_{in},
  D, H, W)`

  and output :math:`(N, C_{out}, D_{out}, H_{out}, W_{out})` can be precisely described
  as:

  .. math::

  out(N_i, C_{out_j}) = bias(C_{out_j}) +

  \sum_{k = 0}^{C_{in} - 1} weight(C_{out_j}, k) \star input(N_i, k)

  where :math:`\star` is the valid 3D `cross-correlation`_ operator

  '
inputs:
