constraints:
  data_format:
    default: None
    dtype: tf.string
    enum:
    - channels_first
    - channels_last
  padding:
    default: valid
    dtype: tf.string
    enum:
    - same
    - valid
  pool_size:
    default: (2, 2, 2)
    dtype: int
    structure:
    - integer
    - tuple
    shape: 3
  strides:
    default: None
    dtype: int
    structure:
    - integer
    - tuple
    shape: 3
descp:
  'Max pooling operation for 3D data (spatial or spatio-temporal).'
