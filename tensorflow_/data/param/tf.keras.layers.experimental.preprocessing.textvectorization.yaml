constraints:
  data:
    default: None
    structure:
    - list
  max_tokens:
    default: None
  ngrams:
    default: None
  output_mode:
    default: INT
    dtype:
    - int
    - tf.string
    enum:
    - binary
    - count
    - int
    - integer
    - string
    - tf-idf
    ndim:
    - '0'
