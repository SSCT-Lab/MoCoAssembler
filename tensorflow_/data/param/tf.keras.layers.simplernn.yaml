constraints:
  activation:
    default: tanh
    dtype: tf.string
    enum:
    - tanh
    - None
  activity_regularizer:
    default: None
  bias_constraint:
    default: None
  bias_initializer:
    default: zeros
    dtype: tf.string
  bias_regularizer:
    default: None
  dropout:
    default: 0.0
    dtype: float
  go_backwards:
    default: False
    dtype: tf.bool
    structure:
    - list
  kernel_constraint:
    default: None
  kernel_initializer:
    default: glorot_uniform
    dtype: tf.string
  kernel_regularizer:
    default: None
  recurrent_constraint:
    default: None
  recurrent_dropout:
    default: 0.0
    dtype: float
  recurrent_initializer:
    default: orthogonal
    dtype: tf.string
  recurrent_regularizer:
    default: None
  return_sequences:
    default: False
    dtype: tf.bool
  return_state:
    default: False
    dtype: tf.bool
  stateful:
    default: False
    dtype: tf.bool
  units:
    dtype: int
    range: '[0, inf)'
  unroll:
    default: False
    dtype: tf.bool
  use_bias:
    default: True
    dtype: tf.bool
    structure:
    - list
descp:
  'Fully-connected RNN where the output is to be fed back to input.'
