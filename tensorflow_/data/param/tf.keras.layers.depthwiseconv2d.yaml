constraints:
  activation:
    default: None
    dtype: tf.string
  activity_regularizer:
    default: None
    dtype: tf.string
  bias_constraint:
    default: None
    dtype: tf.string
  bias_initializer:
    default: zeros
    dtype: tf.string
  bias_regularizer:
    default: None
    dtype: tf.string
  data_format:
    default: None
    dtype: tf.string
    enum:
    - channels_first
    - channels_last
  depth_multiplier:
    default: 1
    dtype: int
    structure: integer
    range: [0, 8192]
  depthwise_constraint:
    default: None
    dtype: tf.string
  depthwise_initializer:
    default: glorot_uniform
    dtype: tf.string
  depthwise_regularizer:
    default: None
    dtype: tf.string
  kernel_size:
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 2
    range: [0, 128]
  padding:
    default: valid
    dtype: tf.string
    enum:
    - same
    - valid
  strides:
    default: (1, 1)
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 2
    range: [0, 6]
  use_bias:
    default: True
    dtype: tf.bool
required:
  - kernel_size
descp:
  'Depthwise 2D convolution.
  Depthwise convolution is a type of convolution in which each input channel is convolved with a different kernel (called a depthwise kernel). You can understand depthwise convolution as the first step in a depthwise separable convolution.

  It is implemented via the following steps:

  Split the input into individual channels.
  Convolve each channel with an individual depthwise kernel with depth_multiplier output channels.
  Concatenate the convolved outputs along the channels axis.
  Unlike a regular 2D convolution, depthwise convolution does not mix information across different input channels.

  The depth_multiplier argument determines how many filter are applied to one input channel. As such, it controls the amount of output channels that are generated per input channel in the depthwise step.'
