constraints:
  axis:
    default: -1
    dtype: int
    structure: integer
    shape: 1
    range: [-1, 3]
  momentum:
    default: 0.99
    dtype: float
  epsilon:
    default: 0.001
    dtype: float
  center:
    default: True
    dtype: tf.bool
  scale:
    default: True
    dtype: tf.bool
  beta_initializer:
    default: zeros
    dtype: tf.string
  gamma_initializer:
    default: ones
    dtype: tf.string
  moving_mean_initializer:
    default: zeros
    dtype: tf.string
  moving_variance_initializer:
    default: ones
    dtype: tf.string
  beta_regularizer:
    default: None
    dtype: tf.string
  gamma_regularizer:
    default: None
    dtype: tf.string
  beta_constraint:
    default: None
    dtype: tf.string
  gamma_constraint:
    default: None
    dtype: tf.string
  synchronized:
    default: False
    dtype: tf.bool
required: []
descp:
  'Layer that normalizes its inputs.
   Batch normalization applies a transformation that maintains the mean output close to 0 and the output standard deviation close to 1.

   Importantly, batch normalization works differently during training and during inference.'
