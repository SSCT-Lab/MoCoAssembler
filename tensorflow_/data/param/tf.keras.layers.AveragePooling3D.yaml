constraints:
  data_format:
    default: None
    dtype: tf.string
    enum:
    - channels_first
    - channels_last
  padding:
    default: valid
    dtype: tf.string
    enum:
    - same
    - valid
  pool_size:
    default: (2, 2, 2)
    dtype: int
    structure:
    - integer
    - tuple
    shape: 3
  strides:
    default: None
    dtype: int
    structure:
    - integer
    - tuple
    shape: 3
descp:
  'Average pooling operation for 3D data (spatial or spatio-temporal).
   Downsamples the input along its spatial dimensions (depth, height, and width) by taking the average value over an input window (of size defined by pool_size) for each channel of the input. The window is shifted by strides along each dimension.'
