constraints:
  data_format:
    default: None
    dtype: tf.string
    enum:
    - channels_first
    - channels_last
  interpolation:
    default: nearest
    dtype: tf.string
    enum:
    - area
    - bicubic
    - bilinear
    - gaussian
    - lanczos3
    - lanczos5
    - mitchellcubic
    - nearest
  size:
    default: (2, 2)
    dtype: int
    structure:
    - integer
    - tuple
    shape: 2
descp:
  'Upsampling layer for 2D inputs.'
