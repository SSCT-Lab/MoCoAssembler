constraints:
  cropping:
    default: ((1, 1), (1, 1), (1, 1))
    dtype: int
    structure:
    - tuple_of_tuples
    shape: 3
  data_format:
    default: None
    dtype: tf.string
    enum:
    - channels_first
    - channels_last
descp:
  'Cropping layer for 3D data (e.g. spatial or spatio-temporal).'