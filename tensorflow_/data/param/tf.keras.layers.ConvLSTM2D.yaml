constraints:
  activation:
    default: tanh
    dtype: tf.string
  activity_regularizer:
    default: None
    dtype: tf.string
  bias_constraint:
    default: None
    dtype: tf.string
  bias_initializer:
    default: zeros
    dtype: tf.string
  bias_regularizer:
    default: None
    dtype: tf.string
  data_format:
    default: None
    dtype: tf.string
    enum:
    - channels_first
    - channels_last
  dilation_rate:
    default: (1, 1)
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 2
    range: [0, 6]
  dropout:
    default: 0.0
    dtype: float
  filters:
    dtype: int
    structure: integer
    shape: 1
    range: [0, 8192]
  go_backwards:
    default: False
    dtype: tf.bool
  kernel_constraint:
    default: None
    dtype: tf.string
  kernel_initializer:
    default: glorot_uniform
    dtype: tf.string
  kernel_regularizer:
    default: None
    dtype: tf.string
  kernel_size:
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 2
    range: [0, 128]
  padding:
    default: valid
    dtype: tf.string
    enum:
    - same
    - valid
  recurrent_activation:
    default: hard_sigmoid
    dtype: tf.string
  recurrent_constraint:
    default: None
    dtype: tf.string
  recurrent_dropout:
    default: 0.0
    dtype: float
  recurrent_initializer:
    default: orthogonal
    dtype: tf.string
  recurrent_regularizer:
    default: None
    dtype: tf.string
  return_sequences:
    default: False
    dtype: tf.bool
  return_state:
    default: False
    dtype: tf.bool
  stateful:
    default: False
    dtype: tf.bool
  strides:
    default: (1, 1)
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 2
    range: [0, 6]
  unit_forget_bias:
    default: True
    dtype: tf.bool
  use_bias:
    default: True
    dtype: tf.bool
required:
  - filters
  - kernel_size
descp:
  '2D Convolutional LSTM.
   Similar to an LSTM layer, but the input transformations and recurrent transformations are both convolutional.'
