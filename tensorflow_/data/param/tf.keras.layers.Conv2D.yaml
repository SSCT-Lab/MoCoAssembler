constraints:
  activation:
    default: None
    dtype: tf.string
    enum:
    - softmax
    - elu
    - selu
    - softplus
    - softsign
    - swish
    - relu
    - gelu
    - tanh
    - sigmoid
    - exponential
    - hard_sigmoid
    - linear
    - serialize
    - deserialize
  activity_regularizer:
    default: None
    dtype: tf.string
  bias_constraint:
    default: None
    dtype: tf.string
    structure: list
  bias_initializer:
    default: zeros
    dtype: tf.string
  bias_regularizer:
    default: None
    dtype: tf.string
  data_format:
    default: None
    dtype: tf.string
    enum:
    - channels_first
    - channels_last
  dilation_rate:
    default: (1, 1)
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 2
    range: [0, 6]
  filters:
    dtype: int
    structure: integer
    shape: 1
    range: [0, 8192]
  kernel_constraint:
    default: None
    dtype: tf.string
  kernel_initializer:
    default: glorot_uniform
    dtype: tf.string
  kernel_regularizer:
    default: None
    dtype: tf.string
  kernel_size:
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 2
    range: [0, 128]
  padding:
    default: valid
    dtype: tf.string
    enum:
    - same
    - valid
  strides:
    default: (1, 1)
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 2
    range: [0, 6]
  use_bias:
    default: True
    dtype: tf.bool
required:
  - filters
  - kernel_size
descp: '2D convolution layer (e.g. spatial convolution over images).
   This layer creates a convolution kernel that is convolved with the layer input to produce a tensor of outputs. If use_bias is True, a bias vector is created and added to the outputs. Finally, if activation is not None, it is applied to the outputs as well.

   When using this layer as the first layer in a model, provide the keyword argument input_shape (tuple of integers or None, does not include the sample axis), e.g. input_shape=(128, 128, 3) for 128x128 RGB pictures in data_format="channels_last". You can use None when a dimension has variable size.'
