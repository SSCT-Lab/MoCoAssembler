constraints:
  activation:
    default: None
    dtype: tf.string
    enum:
    - softmax
    - elu
    - selu
    - softplus
    - softsign
    - swish
    - relu
    - gelu
    - tanh
    - sigmoid
    - exponential
    - hard_sigmoid
    - linear
    - serialize
    - deserialize
  activity_regularizer:
    default: None
    dtype: tf.string
  bias_constraint:
    default: None
    dtype: tf.string
  bias_initializer:
    default: zeros
    dtype: tf.string
  bias_regularizer:
    default: None
    dtype: tf.string
  data_format:
    default: None
    dtype: tf.string
    enum:
    - channels_first
    - channels_last
  depth_multiplier:
    default: 1
    dtype: int
    structure: integer
    shape: 1
    range: [0, 2048]
  depthwise_constraint:
    default: None
    dtype: tf.string
  depthwise_initializer:
    default: glorot_uniform
    dtype: tf.string
  depthwise_regularizer:
    default: None
    dtype: tf.string
  dilation_rate:
    default: (1, 1)
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 2
    range: [0, 6]
  filters:
    dtype: int
    structure: integer
    shape: 1
    range: [0, 2048]
  kernel_size:
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 2
    range: [0, 128]
  padding:
    default: valid
    dtype: tf.string
    enum:
    - same
    - valid
  pointwise_constraint:
    default: None
    dtype: tf.string
  pointwise_initializer:
    default: glorot_uniform
    dtype: tf.string
  pointwise_regularizer:
    default: None
    dtype: tf.string
  strides:
    default: (1, 1)
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 2
    range: [0, 6]
  use_bias:
    default: True
    dtype: tf.bool
required:
  - filters
  - kernel_size
descp:
  'Depthwise separable 2D convolution.
   Separable convolutions consist of first performing a depthwise spatial convolution (which acts on each input channel separately) followed by a pointwise convolution which mixes the resulting output channels. The depth_multiplier argument controls how many output channels are generated per input channel in the depthwise step.

   Intuitively, separable convolutions can be understood as a way to factorize a convolution kernel into two smaller kernels, or as an extreme version of an Inception block.'
