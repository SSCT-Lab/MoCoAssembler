constraints:
  activation:
    default: None
    dtype: tf.string
    enum:
    - softmax
    - elu
    - selu
    - softplus
    - softsign
    - swish
    - relu
    - gelu
    - tanh
    - sigmoid
    - exponential
    - hard_sigmoid
    - linear
    - serialize
    - deserialize
  activity_regularizer:
    default: None
    dtype: tf.string
  bias_constraint:
    default: None
    dtype: tf.string
  bias_initializer:
    default: zeros
    dtype: tf.string
  bias_regularizer:
    default: None
    dtype: tf.string
  data_format:
    default: None
    dtype: tf.string
    enum:
    - channels_first
    - channels_last
  filters:
    dtype: int
    structure: integer
    shape: 1
    range: [0, 2048]
  implementation:
    default: 1
    dtype: int
    structure: integer
    shape: 1
    range: [1, 3]
  kernel_constraint:
    default: None
    dtype: tf.string
  kernel_initializer:
    default: glorot_uniform
    dtype: tf.string
  kernel_regularizer:
    default: None
    dtype: tf.string
  kernel_size:
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 1
    range: [0, 128]
  padding:
    default: valid
    dtype: tf.string
  strides:
    default: 1
    dtype: int
    structure:
    - integer
    - list
    - tuple
    shape: 1
    range: [0, 6]
  use_bias:
    default: True
    dtype: tf.bool
required:
  - filters
  - kernel_size
descp:
  'Locally-connected layer for 1D inputs.
   The LocallyConnected1D layer works similarly to the Conv1D layer, except that weights are unshared, that is, a different set of filters is applied at each different patch of the input.

   Note: layer attributes cannot be modified after the layer has been called once (except the trainable attribute).'
