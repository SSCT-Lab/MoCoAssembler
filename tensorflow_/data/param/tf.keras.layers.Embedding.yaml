constraints:
  activity_regularizer:
    default: None
    dtype: tf.string
  embeddings_constraint:
    default: None
    dtype: tf.string
  embeddings_initializer:
    default: uniform
    dtype: tf.string
  embeddings_regularizer:
    default: None
    dtype: tf.string
  input_dim:
    dtype: int
    structure: integer
    shape: 1
    range: [0, 8192]
  input_length:
    default: None
    dtype: tf.string
  mask_zero:
    default: False
    dtype: tf.bool
  output_dim:
    dtype: int
    structure: integer
    shape: 1
    range: [0, 8192]
required:
  - input_dim
  - output_dim
descp:
  'Turns positive integers (indexes) into dense vectors of fixed size.'
