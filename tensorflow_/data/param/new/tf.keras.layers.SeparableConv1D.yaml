constraints:
  activation:
    default: None
    dtype: tf.string
    enum:
    - softmax
    - elu
    - selu
    - softplus
    - softsign
    - swish
    - relu
    - gelu
    - tanh
    - sigmoid
    - exponential
    - hard_sigmoid
    - linear
    - serialize
    - deserialize
  activity_regularizer:
    default: None
  bias_constraint:
    default: None
  bias_initializer:
    default: zeros
    dtype: tf.string
  bias_regularizer:
    default: None
  data_format:
    default: None
    dtype: tf.string
    enum:
    - channels_first
    - channels_last
  depth_multiplier:
    default: 1
    dtype: int
    range: '[0,inf)'
  depthwise_constraint:
    default: None
  depthwise_initializer:
    default: glorot_uniform
    dtype: tf.string
  depthwise_regularizer:
    default: None
  dilation_rate:
    default: 1
    dtype: int
  filters:
    dtype: int
    range: '[0,inf)'
  kernel_size:
    dtype: int
  name:
    default: None
    dtype: tf.string
  padding:
    default: valid
    dtype: tf.string
    enum:
    - causal
    - same
    - valid
  pointwise_constraint:
    default: None
  pointwise_initializer:
    default: glorot_uniform
    dtype: tf.string
  pointwise_regularizer:
    default: None
  strides:
    default: 1
    dtype: int
  trainable:
    default: None
    dtype: tf.bool
  use_bias:
    default: True
    dtype: tf.bool
descp:
  'Depthwise separable 1D convolution.
   This layer performs a depthwise convolution that acts separately on channels, followed by a pointwise convolution that mixes channels. If use_bias is True and a bias initializer is provided, it adds a bias vector to the output. It then optionally applies an activation function to produce the final output.'
