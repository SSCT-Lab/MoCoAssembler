constraints:
  activation:
    default: tanh
    dtype:
    - tf.string
    enum:
    - tanh
    - None
  bias_constraint:
    default: None
  bias_initializer:
    default: zeros
    dtype: tf.string
  bias_regularizer:
    default: None
  dropout:
    default: 0.0
    dtype: float
  kernel_constraint:
    default: None
  kernel_initializer:
    default: glorot_uniform
    dtype:
    - tf.string
  kernel_regularizer:
    default: None
  recurrent_constraint:
    default: None
  recurrent_dropout:
    default: 0.0
    dtype: float
  recurrent_initializer:
    default: orthogonal
    dtype: tf.string
  recurrent_regularizer:
    default: None
  units:
    dtype: int
    range: '[0, inf)'
  use_bias:
    default: True
    dtype: tf.bool
descp:
  'Cell class for SimpleRNN.'
