api: torch.nn.InstanceNorm3d(num_features, eps=1e-05, momentum=0.1, affine=False,
  track_running_stats=False, device=None, dtype=None)
constraints:
  affine:
    default: 'False'
    dtype:
    - torch.bool
  eps:
    default: 1e-05
    dtype:
    - torch.float32
  momentum:
    default: '0.1'
    dtype:
    - torch.float32
  num_features:
    dtype:
    - int
    range: LIMITED
  track_running_stats:
    default: 'False'
    dtype:
    - torch.bool
descp: 'r"""Applies Instance Normalization over a 5D input (a mini-batch of 3D inputs

  with additional channel dimension) as described in the paper

  `Instance Normalization: The Missing Ingredient for Fast Stylization

  <https://arxiv.org/abs/1607.08022>`__.

  .. math::

  y = \frac{x - \mathrm{E}[x]}{ \sqrt{\mathrm{Var}[x] + \epsilon}} * \gamma + \beta

  The mean and standard-deviation are calculated per-dimension separately

  for each object in a mini-batch. :math:`\gamma` and :math:`\beta` are learnable
  parameter vectors

  of size C (where C is the input size) if :attr:`affine` is ``True``.

  The standard-deviation is calculated via the biased estimator, equivalent to

  `torch.var(input, unbiased=False)`.

  By default, this layer uses instance statistics computed from input data in

  both training and evaluation modes.

  If :attr:`track_running_stats` is set to ``True``, during training this

  layer keeps running estimates of its computed mean and variance, which are

  then used for normalization during evaluation. The running estimates are

  kept with a default :attr:`momentum` of 0.1.

  .. note::

  This :attr:`momentum` argument is different from one used in optimizer

  classes and the conventional notion of momentum. Mathematically, the

  update rule for running statistics here is

  :math:`\hat{x}_\text{new} = (1 - \text{momentum}) \times \hat{x} + \text{momentum}
  \times x_t`,

  where :math:`\hat{x}` is the estimated statistic and :math:`x_t` is the

  new observed value.

  .. note::

  :class:`InstanceNorm3d` and :class:`LayerNorm` are very similar, but

  have some subtle differences. :class:`InstanceNorm3d` is applied

  on each channel of channeled data like 3D models with RGB color, but

  :class:`LayerNorm` is usually applied on entire sample and often in NLP

  tasks. Additionally, :class:`LayerNorm` applies elementwise affine

  transform, while :class:`InstanceNorm3d` usually don''t apply affine

  transform.

  Args:

  num_features: :math:`C` from an expected input of size

  :math:`(N, C, D, H, W)` or :math:`(C, D, H, W)`

  eps: a value added to the denominator for numerical stability. Default: 1e-5

  momentum: the value used for the running_mean and running_var computation. Default:
  0.1

  affine: a boolean value that when set to ``True``, this module has

  learnable affine parameters, initialized the same way as done for batch normalization.

  Default: ``False``.

  track_running_stats: a boolean value that when set to ``True``, this

  module tracks the running mean and variance, and when set to ``False``,

  this module does not track such statistics and always uses batch

  statistics in both training and eval modes. Default: ``False``

  Shape:

  - Input: :math:`(N, C, D, H, W)` or :math:`(C, D, H, W)`

  - Output: :math:`(N, C, D, H, W)` or :math:`(C, D, H, W)` (same shape as input)

  Examples::

  >>> # Without Learnable Parameters

  >>> m = nn.InstanceNorm3d(100)

  >>> # With Learnable Parameters

  >>> m = nn.InstanceNorm3d(100, affine=True)

  >>> input = torch.randn(20, 100, 35, 45, 10)

  >>> output = m(input)

  '
inputs:
  optional:
  - eps
  - momentum
  - affine
  - track_running_stats
  required:
  - num_features
