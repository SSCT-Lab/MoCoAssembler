api: torch.nn.AvgPool1d(kernel_size, stride=None, padding=0, ceil_mode=False, count_include_pad=True)
constraints:
  ceil_mode:
    default: 'False'
    dtype:
    - torch.bool
  count_include_pad:
    default: 'True'
    dtype:
    - torch.bool
  kernel_size:
    dtype:
    - int
    - Tuple[int](1)
    range: '[1,inf)'
  padding:
    default: '0'
    dtype:
    - int
    - Tuple[int](1)
  stride:
    default: None
    dtype:
    - int
    - Tuple[int](1)
    range: '[1,inf)'
descp: 'r"""Applies a 1D average pooling over an input signal composed of several

  input planes.

  In the simplest case, the output value of the layer with input size :math:`(N, C,
  L)`,

  output :math:`(N, C, L_{out})` and :attr:`kernel_size` :math:`k`

  can be precisely described as:

  .. math::

  \text{out}(N_i, C_j, l) = \frac{1}{k} \sum_{m=0}^{k-1}

  \text{input}(N_i, C_j, \text{stride} \times l + m)

  If :attr:`padding` is non-zero, then the input is implicitly zero-padded on both
  sides

  for :attr:`padding` number of points.

  Note:

  When ceil_mode=True, sliding windows are allowed to go off-bounds if they start
  within the left padding

  or the input. Sliding windows that would start in the right padded region are ignored.

  The parameters :attr:`kernel_size`, :attr:`stride`, :attr:`padding` can each be

  an ``int`` or a one-element tuple.

  Args:

  kernel_size: the size of the window

  stride: the stride of the window. Default value is :attr:`kernel_size`

  padding: implicit zero padding to be added on both sides

  ceil_mode: when True, will use `ceil` instead of `floor` to compute the output shape

  count_include_pad: when True, will include the zero-padding in the averaging calculation

  Shape:

  - Input: :math:`(N, C, L_{in})` or :math:`(C, L_{in})`.

  - Output: :math:`(N, C, L_{out})` or :math:`(C, L_{out})`, where

  .. math::

  L_{out} = \left\lfloor \frac{L_{in} +

  2 \times \text{padding} - \text{kernel\_size}}{\text{stride}} + 1\right\rfloor

  Examples::

  >>> # pool with window of size=3, stride=2

  >>> m = nn.AvgPool1d(3, stride=2)

  >>> m(torch.tensor([[[1., 2, 3, 4, 5, 6, 7]]]))

  tensor([[[2., 4., 6.]]])

  '
inputs:
  optional:
  - stride
  - padding
  - ceil_mode
  - count_include_pad
  required:
  - kernel_size
