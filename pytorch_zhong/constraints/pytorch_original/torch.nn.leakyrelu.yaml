check_nan: true
constraints:
  inplace:
    default: 'False'
    descp: 'can optionally do the operation in-place. Default: `False`'
    dtype:
    - torch.bool
    ndim:
    - '0'
  negative_slope:
    default: '0.01'
    descp: 'Controls the angle of the negative slope. Default: 1e-2'
    dtype:
    - torch.float32
    ndim:
    - '0'
descp: 'r"""Applies the element-wise function:

  .. math::

  \text{LeakyReLU}(x) = \max(0, x) + \text{negative\_slope} * \min(0, x)

  or

  .. math::

  \text{LeakyReLU}(x) =

  \begin{cases}

  x, & \text{ if } x \geq 0 \\

  \text{negative\_slope} \times x, & \text{ otherwise }

  \end{cases}

  Args:

  negative_slope: Controls the angle of the negative slope (which is used for

  negative input values). Default: 1e-2

  inplace: can optionally do the operation in-place. Default: ``False``

  Shape:

  - Input: :math:`(*)` where `*` means, any number of additional

  dimensions

  - Output: :math:`(*)`, same shape as the input

  .. image:: ../scripts/activation_images/LeakyReLU.png

  Examples::

  >>> m = nn.LeakyReLU(0.1)

  >>> input = torch.randn(2)

  >>> output = m(input)

  '
inputs:
  optional:
  - negative_slope
  - inplace
  required: []
layer_constructor: true
link: https://pytorch.org/docs/1.5.0/nn.html#torch.nn.LeakyReLU
package: torch
target: LeakyReLU
title: torch.nn.LeakyReLU
version: 1.5.0
