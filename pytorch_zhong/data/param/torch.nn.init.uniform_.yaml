api: torch.nn.init.uniform_(tensor, a=0.0, b=1.0)
constraints:
  a:
    default: '0.0'
    dtype:
    - torch.float32
  b:
    default: '1.0'
    dtype:
    - torch.float32
  tensor:
    dtype:
    - torch.Tensor
    range: LIMITED
descp: 'r"""Fills the input Tensor with values drawn from the uniform

  distribution :math:`\mathcal{U}(a, b)`.

  Args:

  tensor: an n-dimensional `torch.Tensor`

  a: the lower bound of the uniform distribution

  b: the upper bound of the uniform distribution

  Examples:

  >>> w = torch.empty(3, 5)

  >>> nn.init.uniform_(w)

  '
inputs:
  optional:
  - a
  - b
  required:
  - tensor
