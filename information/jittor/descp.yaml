jittor.nn.Conv: "    ''' Applies a 2D convolution over an input signal composed of\
  \ several input planes.\n\n    :param in_channels: Number of channels in the input\
  \ feature map\n    :type in_channels: int\n\n    :param out_channels: Number of\
  \ channels in the output feature map\n    :type out_channels: int\n\n    :param\
  \ kernel_size: Size of the convolving kernel\n    :type kernel_size: int or tuple\n\
  \n    :param stride: Stride of the convolution. Default: 1\n    :type stride: int\
  \ or tuple, optional\n\n    :param padding: Padding added to all four sides of the\
  \ input. Default: 0\n    :type padding: int or tuple, optional\n\n    :param dilation:\
  \ Spacing between kernel elements. Default: 1\n    :type dilation: int or tuple,\
  \ optional\n\n    :param groups: Number of blocked connections from input channels\
  \ to output channels. Default: 1\n    :type groups: int, optional\n\n    :param\
  \ bias: If True, adds a learnable bias to the output. Default: True\n    :type bias:\
  \ bool, optional\n\n    \n'''"
