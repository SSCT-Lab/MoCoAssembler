jittor.nn.ReLU: "    r''' Applies the element-wise function:\n\n    .. math::\n  \
  \      \\text{ReLU6}(x) = \\max(0,x)\n\n    :param x: the input var\n    :type x:\
  \ jt.Var\n\n    \n'''"
jittor.nn.ReLU6: "    r''' Applies the element-wise function:\n\n    .. math::\n \
  \       \\text{ReLU6}(x) = \\min(\\max(0,x), 6)\n\n    :param x: the input var\n\
