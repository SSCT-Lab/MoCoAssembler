jittor.nn.ELU: "    r''' Applies the element-wise function:\n\n    .. math::\n   \
  \     \\text{ELU}(x) = \\begin{cases}\n        x, & \\text{ if } x > 0\\\\\n   \
  \     \\alpha * (\\exp(x) - 1), & \\text{ if } x \\leq 0\n        \\end{cases}\n\
  \n    :param x: the input var\n    :type x: jt.Var\n\n    :param alpha: the :math:`\\\
  alpha` value for the ELU formulation. Default: 1.0\n    :param alpha: float, optional\n\
  \n    \n'''"
jittor.nn.Embedding: "    ''' A simple lookup table that stores embeddings of a fixed\
  \ dictionary and size.\n\n        :param num: size of the dictionary of embeddings\n\
  \        :type num: int\n\n        :param dim: the size of each embedding vector\n\
  \        :type dim: int\n\n        \n'''"
jittor.nn.Flatten: "    ''' Flattens the contiguous range of dimensions in a Var.\n\
  \n    :param start_dim: the first dimension to be flattened. Defaults: 1.\n    :type\
  \ start_dim: int\n\n    :param end_dim: the last dimension to be flattened. Defaults:\
  \ -1.\n    :type end_dim: int\n\n'''"
jittor.nn.GELU: "    r''' Applies the element-wise function:\n\n    .. math::\n  \
  \      \\text{GELU}(x) = x * \\Phi(x)\n\n    where :math:`\\Phi(x)` is the Cumulative\
  \ Distribution Function for Gaussian Distribution.\n\n    :param x: the input var\n\
  \    :type x: jt.Var\n\n    \n'''"
jittor.nn.GRUCell: "    ''' A gated recurrent unit (GRU) cell.\n\n    :param input_size:\
