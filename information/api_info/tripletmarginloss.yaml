function:
  torch: torch.nn.TripletMarginLoss
  ms: mindspore.nn.TripletMarginLoss
descp:
  torch: Creates a criterion that measures the triplet loss given an input tensors
    x1x1x1, x2x2x2, x3x3x3 and a margin with a value greater than 000. This is used
    for measuring a relative similarity between samples. A triplet is composed by
    a, p and n (i.e., anchor, positive examples and negative examples respectively).
    The shapes of all input tensors should be (N,D)(N, D)(N,D).
  ms: TripletMarginLoss operation.
param: null
