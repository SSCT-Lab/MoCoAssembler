function:
  torch: torch.nn.Softmax2d
  ms: mindspore.nn.Softmax2d
  paddle: paddle.nn.Softmax2D
descp:
  torch: Applies SoftMax over features to each spatial location.
  ms: Softmax function applied to 2D features data.
  paddle: Softmax2D Activation. Given a Tensor with shape (B, C, H, W) or (C, H, W),
    it will apply Softmax to each location (C, h_i, w_j). The sum of result in each
    location (C, H_i, W_j) will be one.
param: null
