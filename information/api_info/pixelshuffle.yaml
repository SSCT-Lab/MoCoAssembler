function:
  torch: torch.nn.PixelShuffle
  ms: mindspore.nn.PixelShuffle
  paddle: paddle.nn.PixelShuffle
  jittor: jittor.nn.PixelShuffle
descp:
  torch: "Rearranges elements in a tensor of shape (\u2217,C\xD7r2,H,W)(*, C \\times\
    \ r^2, H, W)(\u2217,C\xD7r2,H,W) to a tensor of shape (\u2217,C,H\xD7r,W\xD7r)(*,\
    \ C, H \\times r, W \\times r)(\u2217,C,H\xD7r,W\xD7r), where r is an upscale\
    \ factor."
  ms: Applies the PixelShuffle operation over input which implements sub-pixel convolutions
    with stride \(1/r\) .
  paddle: 'Rearranges elements in a tensor of shape \([N, C, H, W]\) to a tensor of
    shape \([N, C/upscale_factor^2, H*upscale_factor, W*upscale_factor]\), or from
    shape \([N, H, W, C]\) to \([N, H*upscale_factor, W*upscale_factor, C/upscale_factor^2]\).
    This is useful for implementing efficient sub-pixel convolution with a stride
    of 1/upscale_factor. Please refer to the paper: Real-Time Single Image and Video
    Super-Resolution Using an Efficient Sub-Pixel Convolutional Neural Network . by
    Shi et. al (2016) for more details.'
  jittor: no description
param: null
