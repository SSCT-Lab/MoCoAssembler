function:
  torch: torch.nn.AdaptiveAvgPool1d
  ms: mindspore.nn.AdaptiveAvgPool1d
  paddle: paddle.nn.AdaptiveAvgPool1D
descp:
  torch: Applies a 1D adaptive average pooling over an input signal composed of several
    input planes.
  ms: Applies a 1D adaptive average pooling over an input Tensor which can be regarded
    as a composition of 1D input planes.
  paddle: A 1D adaptive average pooling over an input signal composed of several input
    planes, based on output_size. Input and output are in NCL format, where N is batch
    size, C is the number of channels and L is the length of the feature. The shape
    of output will be \([N, C, output\_size]\).
param: null
