function:
  torch: torch.nn.BatchNorm3d
  ms: mindspore.nn.BatchNorm3d
  paddle: paddle.nn.BatchNorm3D
  jittor: jittor.nn.BatchNorm3d
descp:
  torch: 'Applies Batch Normalization over a 5D input (a mini-batch of 3D inputs with
    additional channel dimension) as described in the paper Batch Normalization: Accelerating
    Deep Network Training by Reducing Internal Covariate Shift .'
  ms: Batch Normalization is widely used in convolutional networks. This layer applies
    Batch Normalization over a 5D input (a mini-batch of 3D inputs with additional
    channel dimension) to avoid internal covariate shift.
  paddle: 'Applies Batch Normalization over a 5D input (a mini-batch of 3D inputswith
    additional channel dimension) as described in the paper Batch Normalization: Accelerating
    Deep Network Training by Reducing Internal Covariate Shift .'
  jittor: no description
param: null
