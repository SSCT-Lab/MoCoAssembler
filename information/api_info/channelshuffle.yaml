function:
  torch: torch.nn.ChannelShuffle
  ms: mindspore.nn.ChannelShuffle
  paddle: paddle.nn.ChannelShuffle
descp:
  torch: "Divide the channels in a tensor of shape (\u2217,C,H,W)(*, C , H, W)(\u2217\
    ,C,H,W) into g groups and rearrange them as (\u2217,Cg,g,H,W)(*, C \\frac g, g,\
    \ H, W)(\u2217,C,g\u200Bg,H,W), while keeping the original tensor shape."
  ms: Divide the channels of Tensor whose shape is \((*, C, H, W)\) into \(g\) groups
    to obtain a Tensor with shape \((*, C \frac g, g, H, W)\), and transpose along
    the corresponding axis of \(C\), \(\frac{g}{}\) and \(g\) to restore Tensor to
    the original shape.
  paddle: 'Can divide channels in a tensor of shape [N, C, H, W] or [N, H, W, C] into
    g groups, getting a tensor with the shape of [N, g, C/g, H, W] or [N, H, W, g,
    C/g], and transposes them as [N, C/g, g, H, W] or [N, H, W, g, C/g], then rearranges
    them to original tensor shape. This operation can improve the interaction between
    channels, using features efficiently. Please refer to the paper: ShuffleNet: An
    Extremely Efficient Convolutional Neural Network for Mobile Devices . by Zhang
    et. al (2017) for more details.'
param: null
