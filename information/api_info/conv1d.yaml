function:
  torch: torch.nn.Conv1d
  ms: mindspore.nn.Conv1d
  paddle: paddle.nn.Conv1D
  jittor: jittor.nn.Conv1d
  tf: tf.keras.layers.Conv1D
descp:
  torch: Applies a 1D convolution over an input signal composed of several input planes.
  ms: Calculates the 1D convolution on the input tensor.
  paddle: "This interface is used to construct a callable object of the Conv1D class.\
    \ For more details, refer to code examples. The convolution1D layer calculates\
    \ the output based on the input, filter and stride, padding, dilation, groups\
    \ parameters. Input and Output are in NCL format or NLC format, where N is batch\
    \ size, C is the number of the feature map, L is the length of the feature map.\
    \ Filter\u2019s shape is [MCK] , where M is the number of output feature map,\
    \ C is the number of input feature map, K is the size of the kernel. If the groups\
    \ is greater than 1, C will equal the number of input feature map divided by the\
    \ groups. If bias attribution and activation type are provided, bias is added\
    \ to the output of the convolution, and the corresponding activation function\
    \ is applied to the final result."
  jittor: "    ''' Applies a 1D convolution over an input signal composed of several\
    \ input planes.\n\n    :param in_channels: Number of channels in the input feature\
    \ map\n    :type in_channels: int\n\n    :param out_channels: Number of channels\
    \ in the output feature map\n    :type out_channels: int\n\n    :param kernel_size:\
    \ Size of the convolving kernel\n    :type kernel_size: int or tuple\n\n    :param\
    \ stride: Stride of the convolution. Default: 1\n    :type stride: int or tuple,\
    \ optional\n\n    :param padding: Padding added to all four sides of the input.\
    \ Default: 0\n    :type padding: int or tuple, optional\n\n    :param dilation:\
    \ Spacing between kernel elements. Default: 1\n    :type dilation: int or tuple,\
    \ optional\n\n    :param groups: Number of blocked connections from input channels\
    \ to output channels. Default: 1\n    :type groups: int, optional\n\n    :param\
    \ bias: If True, adds a learnable bias to the output. Default: True\n    :type\
    \ bias: bool, optional\n\n    \n'''"
  tf: 1D convolution layer (e.g. temporal convolution).
param: null
