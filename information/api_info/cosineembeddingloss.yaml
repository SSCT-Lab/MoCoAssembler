function:
  torch: torch.nn.CosineEmbeddingLoss
  ms: mindspore.nn.CosineEmbeddingLoss
descp:
  torch: "Creates a criterion that measures the loss given input tensors x1x_1x1\u200B\
    , x2x_2x2\u200B and a Tensor label yyy with values 1 or -1. This is used for measuring\
    \ whether two inputs are similar or dissimilar, using the cosine similarity, and\
    \ is typically used for learning nonlinear embeddings or semi-supervised learning."
  ms: CosineEmbeddingLoss creates a criterion to measure the similarity between two
    tensors using cosine distance.
param: null
