api: torch.nn.GRUCell(input_size, hidden_size, bias=True, device=None, dtype=None)
constraints:
  bias:
    default: True
    dtype: torch.bool
  hidden_size:
    dtype: int
    structure:
    - integer
    shape: 1
    range: [1, 256]
  input_size:
    dtype: int
    structure:
    - integer
    shape: 1
    range: [1, 1]
descp: 'r"""A gated recurrent unit (GRU) cell

  .. math::

  \begin{array}{ll}

  r = \sigma(W_{ir} x + b_{ir} + W_{hr} h + b_{hr}) \\

  z = \sigma(W_{iz} x + b_{iz} + W_{hz} h + b_{hz}) \\

  n = \tanh(W_{in} x + b_{in} + r * (W_{hn} h + b_{hn})) \\

  h'' = (1 - z) * n + z * h

  \end{array}

  where :math:`\sigma` is the sigmoid function, and :math:`*` is the Hadamard product.

  Args:

  input_size: The number of expected features in the input `x`

  hidden_size: The number of features in the hidden state `h`

  bias: If ``False``, then the layer does not use bias weights `b_ih` and

  `b_hh`. Default: ``True``

  Inputs: input, hidden

  - **input** : tensor containing input features

  - **hidden** : tensor containing the initial hidden

  state for each element in the batch.

  Defaults to zero if not provided.

  Outputs: h''

  - **h''** : tensor containing the next hidden state

  for each element in the batch

  Shape:

  - input: :math:`(N, H_{in})` or :math:`(H_{in})` tensor containing input features
  where

  :math:`H_{in}` = `input_size`.

  - hidden: :math:`(N, H_{out})` or :math:`(H_{out})` tensor containing the initial
  hidden

  state where :math:`H_{out}` = `hidden_size`. Defaults to zero if not provided.

  - output: :math:`(N, H_{out})` or :math:`(H_{out})` tensor containing the next hidden
  state.

  Attributes:

  weight_ih: the learnable input-hidden weights, of shape

  `(3*hidden_size, input_size)`

  weight_hh: the learnable hidden-hidden weights, of shape

  `(3*hidden_size, hidden_size)`

  bias_ih: the learnable input-hidden bias, of shape `(3*hidden_size)`

  bias_hh: the learnable hidden-hidden bias, of shape `(3*hidden_size)`

  .. note::

  All the weights and biases are initialized from :math:`\mathcal{U}(-\sqrt{k}, \sqrt{k})`

  where :math:`k = \frac{1}{\text{hidden\_size}}`

  On certain ROCm devices, when using float16 inputs this module will use :ref:`different
  precision<fp16_on_mi200>` for backward.

  Examples::

  >>> rnn = nn.GRUCell(10, 20)

  >>> input = torch.randn(6, 3, 10)

  >>> hx = torch.randn(3, 20)

  >>> output = []

  >>> for i in range(6):

  ...     hx = rnn(input[i], hx)

  ...     output.append(hx)

  '
inputs:
  optional:
  - bias
  required:
  - input_size
  - hidden_size
