api: torch.nn.Bilinear(in1_features, in2_features, out_features, bias=True, device=None,
  dtype=None)
constraints:
  bias:
    default: True
    dtype: torch.bool
  in1_features:
    dtype: int
    structure:
    - integer
    shape: 1
    range:
  in2_features:
    dtype: int
    structure:
    - integer
    shape: 1
    range:
  out_features:
    dtype: int
    structure:
    - integer
    shape: 1
    range:
descp: 'r"""Applies a bilinear transformation to the incoming data:

  :math:`y = x_1^T A x_2 + b`

  Args:

  in1_features: size of each first input sample

  in2_features: size of each second input sample

  out_features: size of each output sample

  bias: If set to False, the layer will not learn an additive bias.

  Default: ``True``

  Shape:

  - Input1: :math:`(*, H_{in1})` where :math:`H_{in1}=\text{in1\_features}` and

  :math:`*` means any number of additional dimensions including none. All but the
  last dimension

  of the inputs should be the same.

  - Input2: :math:`(*, H_{in2})` where :math:`H_{in2}=\text{in2\_features}`.

  - Output: :math:`(*, H_{out})` where :math:`H_{out}=\text{out\_features}`

  and all but the last dimension are the same shape as the input.

  Attributes:

  weight: the learnable weights of the module of shape

  :math:`(\text{out\_features}, \text{in1\_features}, \text{in2\_features})`.

  The values are initialized from :math:`\mathcal{U}(-\sqrt{k}, \sqrt{k})`, where

  :math:`k = \frac{1}{\text{in1\_features}}`

  bias:   the learnable bias of the module of shape :math:`(\text{out\_features})`.

  If :attr:`bias` is ``True``, the values are initialized from

  :math:`\mathcal{U}(-\sqrt{k}, \sqrt{k})`, where

  :math:`k = \frac{1}{\text{in1\_features}}`

  Examples::

  >>> m = nn.Bilinear(20, 30, 40)

  >>> input1 = torch.randn(128, 20)

  >>> input2 = torch.randn(128, 30)

  >>> output = m(input1, input2)

  >>> print(output.size())

  torch.Size([128, 40])

  '
inputs:
  optional:
  - bias
  required:
  - in1_features
  - in2_features
  - out_features
