descp: 'r"""Applies a 1D max pooling over an input signal composed of several input

  planes.

  In the simplest case, the output value of the layer with input size :math:`(N, C,
  L)`

  and output :math:`(N, C, L_{out})` can be precisely described as:

  .. math::

  out(N_i, C_j, k) = \max_{m=0, \ldots, \text{kernel\_size} - 1}

  input(N_i, C_j, stride \times k + m)

  If :attr:`padding` is non-zero, then the input is implicitly padded with negative
  infinity on both sides

  for :attr:`padding` number of points. :attr:`dilation` is the stride between the
  elements within the

  sliding window. This `link`_ has a nice visualization of the pooling parameters.

  Note:

  When ceil_mode=True, sliding windows are allowed to go off-bounds if they start
  within the left padding

  or the input. Sliding windows that would start in the right padded region are ignored.

  Args:

  kernel_size: The size of the sliding window, must be > 0.

  stride: The stride of the sliding window, must be > 0. Default value is :attr:`kernel_size`.

  padding: Implicit negative infinity padding to be added on both sides, must be >=
  0 and <= kernel_size / 2.

  dilation: The stride between elements within a sliding window, must be > 0.

  return_indices: If ``True``, will return the argmax along with the max values.

  Useful for :class:`torch.nn.MaxUnpool1d` later

  ceil_mode: If ``True``, will use `ceil` instead of `floor` to compute the output
  shape. This

  ensures that every element in the input tensor is covered by a sliding window.

  Shape:

  - Input: :math:`(N, C, L_{in})` or :math:`(C, L_{in})`.

  - Output: :math:`(N, C, L_{out})` or :math:`(C, L_{out})`, where

  .. math::

  L_{out} = \left\lfloor \frac{L_{in} + 2 \times \text{padding} - \text{dilation}

  \times (\text{kernel\_size} - 1) - 1}{\text{stride}} + 1\right\rfloor

  Examples::

  >>> # pool of size=3, stride=2

  >>> m = nn.MaxPool1d(3, stride=2)

  >>> input = torch.randn(20, 16, 50)

  >>> output = m(input)

  .. _link:

  https://github.com/vdumoulin/conv_arithmetic/blob/master/README.md

  '
inputs:
  optional:
    - stride
    - padding
    - dilation
    - return_indices
    - ceil_mode
  required:
    - kernel_size
