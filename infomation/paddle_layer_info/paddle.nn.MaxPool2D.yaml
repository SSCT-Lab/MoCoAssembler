api: paddle.nn.MaxPool2D
constraints:
  ceil_mode:
    default: 'False'
    descp: when True, will use ceil instead of floor to compute the output shapereturn_mask
      (bool, optional) – Whether to return the max indices along with the outputs
    dtype:
    - bool
    enum: null
    range: null
    shape: null
    structure:
    - bool
  data_format:
    default: '''NCHW'''
    descp: 'The data format of the input and output data. An optional string from:
      “NCHW”, “NDHW”. The default is “NCHW”. When it is “NCHW”, the data is stored
      in the order of: [batch_size, input_channels, input_height, input_width]'
    dtype:
    - str
    enum:
    - NCHW
    - NHWC
    range: null
    shape: null
    structure:
    - str
  kernel_size:
    default: null
    descp: The pool kernel size. If pool kernel size is a tuple or list, it must contain
      two integers, (pool_size_Height, pool_size_Width). Otherwise, the pool kernel
      size will be a square of an int
    dtype:
    - int
    enum: null
    range: null
    shape: 2
    structure:
    - int
    - list
    - tuple
  name:
    default: None
    descp: For detailed information, please refer to Name. Usually name is no need
      to set and None by default.           Returns          A callable object of
      MaxPool2D
    dtype:
    - str
    enum:
    - need
    - need
    - need
    - need
    range: null
    shape: null
    structure:
    - str
  padding:
    default: '0'
    descp: The padding size. Padding could be in one of the following forms. 1. A
      string in [‘valid’, ‘same’]. 2. An int, which means the feature map is zero
      padded by size of padding on every sides. 3. A list[int] or tuple(int) whose
      length is 2, [pad_height, pad_weight] whose value means the padding size of
      each dimension. 4. A list[int] or tuple(int) whose length is 4. [pad_height_top,
      pad_height_bottom, pad_width_left, pad_width_right] whose value means the padding
      size of each side. 5. A list or tuple of pairs of integers. It has the form
      [[pad_before, pad_after], [pad_before, pad_after], …]. Note that, the batch
      dimension and channel dimension should be [0,0] or (0,0). The default value
      is 0
    dtype:
    - str
    - int
    enum:
    - valid
    - same
    range: null
    shape: 2
    structure:
    - str
    - int
    - list
    - tuple
  stride:
    default: None
    descp: The pool stride size. If pool stride size is a tuple or list, it must contain
      two integers, (pool_stride_Height, pool_stride_Width). Otherwise, the pool stride
      size will be a square of an int. Default None, then stride will be equal to
      the kernel_size
    dtype:
    - int
    enum: null
    range: null
    shape: 2
    structure:
    - int
    - list
    - tuple
descp: This operation applies 2D max pooling over input feature based on the input,
  and kernel_size, stride, padding parameters. Input(X) and Output(Out) are in NCHW
  format, where N is batch size, C is the number of channels, H is the height of the
  feature, and W is the width of the feature.
inputs:
  optional:
  - stride
  - padding
  - return_mask
  - ceil_mode
  - data_format
  - name
  required:
  - kernel_size
