api: mindspore.nn.TrainOneStepWithLossScaleCell(network, optimizer, scale_sense)
descp: Network training with loss scaling.
constraints:
  network:
    descp: network (Cell) – The training network. The network only supports single
      output.
    default: null
    dtype:
    - cell
  optimizer:
    descp: optimizer (Cell) – Optimizer for updating the network parameters.
    default: null
    dtype:
    - cell
  scale_sense:
    descp: scale_sense (Union[Tensor, Cell]) – If this value is a Cell, it will be
      called by TrainOneStepWithLossScaleCell to update loss scale. If this value
      is a Tensor, the loss scale can be modified by set_sense_scale, the shape should
      be (()) or ((1,)).
    default: null
    dtype:
    - union[tensor, cell]
inputs:
  optional: []
  required: []
