api: mindspore.nn.TrainOneStepCell(network, optimizer, sens=None, return_grad=False)
descp: Network training package class.
constraints:
  network:
    descp: network (Cell) – The training network. The network only supports single
      output.
    default: null
    dtype:
    - cell
  optimizer:
    descp: optimizer (Union[Cell]) – Optimizer for updating the network parameters.
    default: null
    dtype:
    - union[cell]
  sens:
    descp: sens (numbers.Number) – The scaling number to be filled as the input of
      backpropagation. Default value is None , which is 1.0 .
    default: null
    dtype:
    - numbers.number
  return_grad:
    descp: return_grad (bool) – Whether to return gradient. If True, it will return
      the gradient in the form of a dict while returning loss. The key of the dict
      is the parameter name corresponding to the gradient, and value is the gradient
      value. Default value is False .
    default: null
    dtype:
    - bool
inputs:
  optional: []
  required: []
