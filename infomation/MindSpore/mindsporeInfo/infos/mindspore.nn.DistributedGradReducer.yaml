api: mindspore.nn.DistributedGradReducer(parameters, mean=None, degree=None, fusion_type=1,
  group=GlobalComm.WORLD_COMM_GROUP)
descp: A distributed optimizer.
constraints:
  parameters:
    descp: parameters (list) – the parameters to be updated.
    default: null
    dtype: null
    structure:
    - list
  mean:
    descp: 'mean (bool) – When mean is true, the mean coefficient (degree) would apply
      on gradients. When it is not specified, using the configuration gradients_mean
      in auto_parallel_context. Default: None .'
    default: None
    dtype:
    - bool
  degree:
    descp: 'degree (int) – The mean coefficient. Usually it equals to device number.
      Default: None .'
    default: None
    dtype:
    - int
    structure:
    - single
    shape: null
    range: null
  fusion_type:
    descp: 'fusion_type (int) – The type of all reduce fusion. Default: 1 .'
    default: '1'
    dtype:
    - int
    structure:
    - single
    shape: null
    range: null
  group:
    descp: 'group (str) – The communication group to work on. Normally, the group
      should be created by create_group, otherwise, using the default group. Default:
      GlobalComm.WORLD_COMM_GROUP .'
    default: GlobalComm
    dtype:
    - str
    enum: null
inputs:
  optional: []
  required: []
