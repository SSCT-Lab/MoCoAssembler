api: mindspore.nn.Cell(auto_prefix=True, flags=None)
descp: The basic building block of neural networks in MindSpore.
constraints:
  auto_prefix:
    descp: 'auto_prefix (bool, optional) – Whether to automatically generate NameSpace
      for Cell and its child cells. It also affects the names of parameters in the
      Cell. If set to True , the parameter name will be automatically prefixed, otherwise
      not. In general, the backbone network should be set to True , otherwise the
      duplicate name problem will appear. The cell to train the backbone network,
      such as optimizer and mindspore.nn.TrainOneStepCell, should be set to False
      , otherwise the parameter name in backbone will be changed by mistake. Default:
      True .'
    default: 'True'
    dtype:
    - bool
  flags:
    descp: 'flags (dict, optional) – Network configuration information, currently
      it is used for the binding of network and dataset. Users can also customize
      network attributes by this parameter. Default: None .'
    default: None
    dtype: null
    structure:
    - dict
inputs:
  optional:
  - auto_prefix
  - flags
  required: []
