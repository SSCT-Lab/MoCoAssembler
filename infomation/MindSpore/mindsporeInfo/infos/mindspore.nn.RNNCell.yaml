api: 'mindspore.nn.RNNCell(input_size: int, hidden_size: int, has_bias: bool = True,
  nonlinearity: str = ''tanh'')'
descp: An Elman RNN cell with tanh or ReLU non-linearity.
constraints:
  input_size:
    descp: input_size (int) – Number of features of input.
    default: null
    dtype:
    - int
    structure:
    - single
    shape: null
    range: null
  hidden_size:
    descp: hidden_size (int) – Number of features of hidden layer.
    default: null
    dtype:
    - int
    structure:
    - single
    shape: null
    range: null
  has_bias:
    descp: 'has_bias (bool) – Whether the cell has bias b_ih and b_hh. Default: True
      .'
    default: 'True'
    dtype:
    - bool
  nonlinearity:
    descp: 'nonlinearity (str) – The non-linearity to use. Can be either "tanh" or
      "relu" . Default: "tanh" .'
    default: '"tanh"'
    dtype:
    - str
    enum: null
inputs:
  optional: []
  required: []
