function:
  torch: torch.nn.SyncBatchNorm
  ms: mindspore.nn.SyncBatchNorm
  paddle: paddle.nn.SyncBatchNorm
descp:
  torch: 'Applies Batch Normalization over a N-Dimensional input (a mini-batch of
    [N-2]D inputs with additional channel dimension) as described in the paper Batch
    Normalization: Accelerating Deep Network Training by Reducing Internal Covariate
    Shift .'
  ms: Sync Batch Normalization layer over a N-dimension input.
  paddle: 'This interface is used to construct a callable object of the SyncBatchNorm
    class. It implements the function of the Cross-GPU Synchronized Batch Normalization
    Layer, and can be used as a normalizer function for other operations, such as
    conv2d and fully connected operations. The data is normalized by the mean and
    variance of the channel based on whole mini-batch , which including data in all
    gpus. Refer to Batch Normalization: Accelerating Deep Network Training by Reducing
    Internal Covariate Shift for more details.'
param: null
