function:
  torch: torch.nn.UpsamplingNearest2d
  paddle: paddle.nn.UpsamplingNearest2D
  jittor: jittor.nn.UpsamplingNearest2d
descp:
  torch: Applies a 2D nearest neighbor upsampling to an input signal composed of several
    input channels.
  paddle: "This op upsamples a batch of images, using nearest neighbours\u2019 pixel\
    \ values. The input must be a 4-D Tensor of the shape (num_batches, channels,\
    \ in_h, in_w), where in_w is width of the input tensor, in_h is the height of\
    \ the input tensor. And the upsampling only applies on the two dimensions(height\
    \ and width). Nearest neighbor interpolation is to perform nearest neighbor interpolation\
    \ in both the 3rd dimension(in height direction) and the 4th dimension(in width\
    \ direction) on input tensor."
  jittor: no description
param: null
