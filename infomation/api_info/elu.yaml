function:
  torch: torch.nn.ELU
  ms: mindspore.nn.ELU
  paddle: paddle.nn.ELU
  jittor: jittor.nn.ELU
  tf: tf.keras.layers.ELU
descp:
  torch: 'Applies the Exponential Linear Unit (ELU) function, element-wise, as described
    in the paper: Fast and Accurate Deep Network Learning by Exponential Linear Units
    (ELUs).'
  ms: Exponential Linear Unit activation function.
  paddle: ELU Activation.
  jittor: "    r''' Applies the element-wise function:\n\n    .. math::\n        \\\
    text{ELU}(x) = \\begin{cases}\n        x, & \\text{ if } x > 0\\\\\n        \\\
    alpha * (\\exp(x) - 1), & \\text{ if } x \\leq 0\n        \\end{cases}\n\n   \
    \ :param x: the input var\n    :type x: jt.Var\n\n    :param alpha: the :math:`\\\
    alpha` value for the ELU formulation. Default: 1.0\n    :param alpha: float, optional\n\
    \n    \n'''"
  tf: Exponential Linear Unit.
param: null
