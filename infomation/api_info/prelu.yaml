function:
  torch: torch.nn.PReLU
  ms: mindspore.nn.PReLU
  paddle: paddle.nn.PReLU
  jittor: jittor.nn.PReLU
  tf: tf.keras.layers.PReLU
descp:
  torch: 'Applies the element-wise function:'
  ms: PReLU activation function.
  paddle: 'PReLU Activation. The calculation formula is follows:'
  jittor: "    r''' Applies the element-wise function:\n\n    .. math::\n        \\\
    text{PReLU}(x) =\n        \\begin{cases}\n        x, & \\text{ if } x \\geq 0\
    \ \\\\\n        ax, & \\text{ otherwise }\n        \\end{cases}\n\n    :param\
    \ x: the input var\n    :type x: jt.Var\n\n    :param num_parameters: number of\
    \ :math:`a` to learn, can be either 1 or the number of channels at input. Default:\
    \ 1\n    :type num_parameters: int, optional\n\n    :param init: the initial value\
    \ of :math:`a`. Default: 0.25\n    :param init: float, optional\n\n    \n'''"
  tf: Parametric Rectified Linear Unit.
param: null
