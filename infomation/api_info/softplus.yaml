function:
  torch: torch.nn.Softplus
  paddle: paddle.nn.Softplus
  jittor: jittor.nn.Softplus
descp:
  torch: "Applies the Softplus function Softplus(x)=1\u03B2\u2217log\u2061(1+exp\u2061\
    (\u03B2\u2217x))\\text{Softplus}(x) = \\frac{1}{\\beta} * \\log(1 + \\exp(\\beta\
    \ * x))Softplus(x)=\u03B21\u200B\u2217log(1+exp(\u03B2\u2217x)) element-wise."
  paddle: Softplus Activation
  jittor: "    r'''\n    SoftPlus is a smooth approximation to the ReLU function and\
    \ can be used to constrain the output of a machine to always be positive.\n  \
    \  \n    Args:\n        \n        [in] beta (float): the beta value for the Softplus\
    \ formulation. Default: 1.\n        \n        [in] threshold (float): values above\
    \ this revert to a linear function. Default: 20.\n\n'''"
param: null
