function:
  torch: torch.nn.TripletMarginWithDistanceLoss
descp:
  torch: "Creates a criterion that measures the triplet loss given input tensors aaa,\
    \ ppp, and nnn (representing anchor, positive, and negative examples, respectively),\
    \ and a nonnegative, real-valued function (\u201Cdistance function\u201D) used\
    \ to compute the relationship between the anchor and positive example (\u201C\
    positive distance\u201D) and the anchor and negative example (\u201Cnegative distance\u201D\
    )."
param: null
