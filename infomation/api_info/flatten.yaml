function:
  torch: torch.nn.Flatten
  ms: mindspore.nn.Flatten
  paddle: paddle.nn.Flatten
  jittor: jittor.nn.Flatten
  tf: tf.keras.layers.Flatten
descp:
  torch: Flattens a contiguous range of dims into a tensor. For use with Sequential.
  ms: Flatten the input Tensor along dimensions from start_dim to end_dim.
  paddle: This interface is used to construct a callable object of the FLatten class.
    For more details, refer to code examples. It implements flatten a contiguous range
    of dims into a tensor.
  jittor: "    ''' Flattens the contiguous range of dimensions in a Var.\n\n    :param\
    \ start_dim: the first dimension to be flattened. Defaults: 1.\n    :type start_dim:\
    \ int\n\n    :param end_dim: the last dimension to be flattened. Defaults: -1.\n\
    \    :type end_dim: int\n\n'''"
  tf: Flattens the input. Does not affect the batch size.
param: null
