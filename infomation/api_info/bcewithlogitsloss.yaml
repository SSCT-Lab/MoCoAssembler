function:
  torch: torch.nn.BCEWithLogitsLoss
  ms: mindspore.nn.BCEWithLogitsLoss
descp:
  torch: This loss combines a Sigmoid layer and the BCELoss in one single class. This
    version is more numerically stable than using a plain Sigmoid followed by a BCELoss
    as, by combining the operations into one layer, we take advantage of the log-sum-exp
    trick for numerical stability.
  ms: Adds sigmoid activation function to input logits, and uses the given logits
    to compute binary cross entropy between the logits and the labels.
param: null
