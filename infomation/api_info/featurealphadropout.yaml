function:
  torch: torch.nn.FeatureAlphaDropout
descp:
  torch: Randomly masks out entire channels (a channel is a feature map, e.g. the
    jjj-th channel of the iii-th sample in the batch input is a tensor input[i,j]\text{input}[i,
    j]input[i,j]) of the input tensor). Instead of setting activations to zero, as
    in regular Dropout, the activations are set to the negative saturation value of
    the SELU activation function. More details can be found in the paper Self-Normalizing
    Neural Networks .
param: null
