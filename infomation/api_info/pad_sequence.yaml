function:
  torch: torch.nn.utils.rnn.pad_sequence
  ms: mindspore.nn.Pad
  paddle: paddle.nn.Pad2D
descp:
  torch: Pad a list of variable length Tensors with padding_value
  ms: Pads the input tensor according to the paddings and mode.
  paddle: This interface is used to construct a callable object of the Pad2D class.
    Pad tensor according to pad, mode and value. If mode is 'reflect', pad[0] and
    pad[1] must be no greater than width-1. The height dimension has the same condition.
param: null
