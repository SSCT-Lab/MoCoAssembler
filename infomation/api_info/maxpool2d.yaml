function:
  torch: torch.nn.MaxPool2d
  ms: mindspore.nn.MaxPool2d
  paddle: paddle.nn.MaxPool2D
  jittor: jittor.nn.MaxPool2d
descp:
  torch: Applies a 2D max pooling over an input signal composed of several input planes.
  ms: Applies a 2D max pooling over an input Tensor which can be regarded as a composition
    of 2D planes.
  paddle: This operation applies 2D max pooling over input feature based on the input,
    and kernel_size, stride, padding parameters. Input(X) and Output(Out) are in NCHW
    format, where N is batch size, C is the number of channels, H is the height of
    the feature, and W is the width of the feature.
  jittor: no description
param: null
