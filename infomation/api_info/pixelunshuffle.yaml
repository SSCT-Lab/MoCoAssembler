function:
  torch: torch.nn.PixelUnshuffle
  ms: mindspore.nn.PixelUnshuffle
  paddle: paddle.nn.PixelUnshuffle
descp:
  torch: "Reverses the PixelShuffle operation by rearranging elements in a tensor\
    \ of shape (\u2217,C,H\xD7r,W\xD7r)(*, C, H \\times r, W \\times r)(\u2217,C,H\xD7\
    r,W\xD7r) to a tensor of shape (\u2217,C\xD7r2,H,W)(*, C \\times r^2, H, W)(\u2217\
    ,C\xD7r2,H,W), where r is a downscale factor."
  ms: Applies the PixelUnshuffle operation over input which is the inverse of PixelShuffle.
  paddle: 'Rearranges elements in a tensor of shape \([N, C, H, W]\) to a tensor of
    shape \([N, r^2C, H/r, W/r]\), or from shape \([N, H, W, C]\) to \([N, H/r, W/r,
    r^2C]\), where \(r\) is the downscale factor. This operation is the reversion
    of PixelShuffle operation. Please refer to the paper: Real-Time Single Image and
    Video Super-Resolution Using an Efficient Sub-Pixel Convolutional Neural Network
    . by Shi et. al (2016) for more details.'
param: null
