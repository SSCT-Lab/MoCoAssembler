descp:
  torch: Applies a 3D transposed convolution operator over an input image composed
    of several input planes. The transposed convolution operator multiplies each input
    value element-wise by a learnable kernel, and sums over the outputs from all input
    feature planes.
  ms: Calculates a 3D transposed convolution, which can be regarded as Conv3d for
    the gradient of the input.
  paddle: 'Convlution3D transpose layer The convolution3D transpose layer calculates
    the output based on the input, filter, and dilations, strides, paddings. Input(Input)
    and output(Output) are in NCDHW format. Where N is batch size, C is the number
    of channels, D is the depth of the feature, H is the height of the feature, and
    W is the width of the feature. Parameters(dilations, strides, paddings) are two
    elements. These two elements represent height and width, respectively. The details
    of convolution transpose layer, please refer to the following explanation and
    references therein. If bias attribution and activation type are provided, bias
    is added to the output of the convolution, and the corresponding activation function
    is applied to the final result. For each input \(X\), the equation is:'
  jittor: no description
  tf: Transposed convolution layer (sometimes called Deconvolution).
