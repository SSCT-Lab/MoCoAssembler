function:
  torch: torch.nn.Dropout2d
  ms: mindspore.nn.Dropout2d
  paddle: paddle.nn.Dropout2D
  jittor: jittor.nn.Dropout2d
descp:
  torch: Randomly zero out entire channels (a channel is a 2D feature map, e.g., the
    jjj-th channel of the iii-th sample in the batched input is a 2D tensor input[i,j]\text{input}[i,
    j]input[i,j]). Each channel will be zeroed out independently on every forward
    call with probability p using samples from a Bernoulli distribution.
  ms: During training, randomly zeroes some channels of the input tensor with probability
    p from a Bernoulli distribution (For a 4-dimensional tensor with a shape of NCHW,
    the channel feature map refers to a 2-dimensional feature map with the shape of
    HW).
  paddle: 'Randomly zero out entire channels (in the batched input 4d tensor with
    the shape NCHW , a channel is a 2D feature map with the shape HW). Each channel
    will be zeroed out independently on every forward call with probability p using
    samples from a Bernoulli distribution. Dropout2D will help promote independence
    between feature maps as described in the paper: Efficient Object Localization
    Using Convolutional Networks'
  jittor: no description
param: null
