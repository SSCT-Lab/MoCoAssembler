  Cissé, David Grangier, and Hervé Jégou.
torch.nn.AdaptiveMaxPool1d: Applies a 1D adaptive max pooling over an input signal
  composed of several input planes.
torch.nn.AdaptiveMaxPool2d: Applies a 2D adaptive max pooling over an input signal
  composed of several input planes.
torch.nn.AdaptiveMaxPool3d: Applies a 3D adaptive max pooling over an input signal
  composed of several input planes.
torch.nn.AlphaDropout: Applies Alpha Dropout over the input.
torch.nn.AvgPool1d: Applies a 1D average pooling over an input signal composed of
  several input planes.
torch.nn.AvgPool2d: Applies a 2D average pooling over an input signal composed of
  several input planes.
torch.nn.AvgPool3d: Applies a 3D average pooling over an input signal composed of
  several input planes.
torch.nn.BCELoss: 'Creates a criterion that measures the Binary Cross Entropy between
  the target and the input probabilities:'
torch.nn.BCEWithLogitsLoss: This loss combines a Sigmoid layer and the BCELoss in
  one single class. This version is more numerically stable than using a plain Sigmoid
  followed by a BCELoss as, by combining the operations into one layer, we take advantage
  of the log-sum-exp trick for numerical stability.
torch.nn.BatchNorm1d: 'Applies Batch Normalization over a 2D or 3D input as described
  in the paper Batch Normalization: Accelerating Deep Network Training by Reducing
  Internal Covariate Shift .'
torch.nn.BatchNorm2d: 'Applies Batch Normalization over a 4D input (a mini-batch of
  2D inputs with additional channel dimension) as described in the paper Batch Normalization:
  Accelerating Deep Network Training by Reducing Internal Covariate Shift .'
torch.nn.BatchNorm3d: 'Applies Batch Normalization over a 5D input (a mini-batch of
  3D inputs with additional channel dimension) as described in the paper Batch Normalization:
  Accelerating Deep Network Training by Reducing Internal Covariate Shift .'
torch.nn.Bilinear: 'Applies a bilinear transformation to the incoming data: y=x1TAx2+by
  = x_1^T A x_2 + by=x1T​Ax2​+b'
torch.nn.CELU: 'Applies the element-wise function:'
torch.nn.CTCLoss: The Connectionist Temporal Classification loss.
torch.nn.ChannelShuffle: Divide the channels in a tensor of shape (∗,C,H,W)(*, C ,
  H, W)(∗,C,H,W) into g groups and rearrange them as (∗,Cg,g,H,W)(*, C \frac g, g,
  H, W)(∗,C,g​g,H,W), while keeping the original tensor shape.
torch.nn.ConstantPad1d: Pads the input tensor boundaries with a constant value.
torch.nn.ConstantPad2d: Pads the input tensor boundaries with a constant value.
torch.nn.ConstantPad3d: Pads the input tensor boundaries with a constant value.
torch.nn.Conv1d: Applies a 1D convolution over an input signal composed of several
  input planes.
torch.nn.Conv2d: Applies a 2D convolution over an input signal composed of several
  input planes.
torch.nn.Conv3d: Applies a 3D convolution over an input signal composed of several
  input planes.
torch.nn.ConvTranspose1d: Applies a 1D transposed convolution operator over an input
  image composed of several input planes.
torch.nn.ConvTranspose2d: Applies a 2D transposed convolution operator over an input
  image composed of several input planes.
torch.nn.ConvTranspose3d: Applies a 3D transposed convolution operator over an input
  image composed of several input planes. The transposed convolution operator multiplies
  each input value element-wise by a learnable kernel, and sums over the outputs from
  all input feature planes.
torch.nn.CosineEmbeddingLoss: Creates a criterion that measures the loss given input
  tensors x1x_1x1​, x2x_2x2​ and a Tensor label yyy with values 1 or -1. This is used
  for measuring whether two inputs are similar or dissimilar, using the cosine similarity,
  and is typically used for learning nonlinear embeddings or semi-supervised learning.
torch.nn.CosineSimilarity: Returns cosine similarity between x1x_1x1​ and x2x_2x2​,
  computed along dim.
torch.nn.CrossEntropyLoss: This criterion computes the cross entropy loss between
  input logits and target.
torch.nn.DataParallel: Implements data parallelism at the module level.
torch.nn.Dropout: During training, randomly zeroes some of the elements of the input
  tensor with probability p using samples from a Bernoulli distribution. Each channel
  will be zeroed out independently on every forward call.
torch.nn.Dropout1d: Randomly zero out entire channels (a channel is a 1D feature map,
  e.g., the jjj-th channel of the iii-th sample in the batched input is a 1D tensor
  input[i,j]\text{input}[i, j]input[i,j]). Each channel will be zeroed out independently
  on every forward call with probability p using samples from a Bernoulli distribution.
torch.nn.Dropout2d: Randomly zero out entire channels (a channel is a 2D feature map,
  e.g., the jjj-th channel of the iii-th sample in the batched input is a 2D tensor
  input[i,j]\text{input}[i, j]input[i,j]). Each channel will be zeroed out independently
  on every forward call with probability p using samples from a Bernoulli distribution.
torch.nn.Dropout3d: Randomly zero out entire channels (a channel is a 3D feature map,
  e.g., the jjj-th channel of the iii-th sample in the batched input is a 3D tensor
  input[i,j]\text{input}[i, j]input[i,j]). Each channel will be zeroed out independently
  on every forward call with probability p using samples from a Bernoulli distribution.
torch.nn.ELU: 'Applies the Exponential Linear Unit (ELU) function, element-wise, as
  described in the paper: Fast and Accurate Deep Network Learning by Exponential Linear
  Units (ELUs).'
torch.nn.Embedding: A simple lookup table that stores embeddings of a fixed dictionary
  and size.
torch.nn.EmbeddingBag: Computes sums or means of ‘bags’ of embeddings, without instantiating
  the intermediate embeddings.
torch.nn.FeatureAlphaDropout: Randomly masks out entire channels (a channel is a feature
  map, e.g. the jjj-th channel of the iii-th sample in the batch input is a tensor
  input[i,j]\text{input}[i, j]input[i,j]) of the input tensor). Instead of setting
  activations to zero, as in regular Dropout, the activations are set to the negative
  saturation value of the SELU activation function. More details can be found in the
  paper Self-Normalizing Neural Networks .
torch.nn.Flatten: Flattens a contiguous range of dims into a tensor. For use with
  Sequential.
torch.nn.Fold: Combines an array of sliding local blocks into a large containing tensor.
torch.nn.FractionalMaxPool2d: Applies a 2D fractional max pooling over an input signal
  composed of several input planes.
torch.nn.FractionalMaxPool3d: Applies a 3D fractional max pooling over an input signal
  composed of several input planes.
torch.nn.GELU: 'Applies the Gaussian Error Linear Units function:'
torch.nn.GLU: Applies the gated linear unit function GLU(a,b)=a⊗σ(b){GLU}(a, b)= a
  \otimes \sigma(b)GLU(a,b)=a⊗σ(b) where aaa is the first half of the input matrices
  and bbb is the second half.
torch.nn.GRU: Applies a multi-layer gated recurrent unit (GRU) RNN to an input sequence.
torch.nn.GRUCell: A gated recurrent unit (GRU) cell
torch.nn.GaussianNLLLoss: Gaussian negative log likelihood loss.
torch.nn.GroupNorm: Applies Group Normalization over a mini-batch of inputs as described
  in the paper Group Normalization
torch.nn.Hardshrink: Applies the Hard Shrinkage (Hardshrink) function element-wise.
torch.nn.Hardsigmoid: Applies the Hardsigmoid function element-wise.
torch.nn.Hardswish: 'Applies the Hardswish function, element-wise, as described in
  the paper: Searching for MobileNetV3.'
torch.nn.Hardtanh: Applies the HardTanh function element-wise.
torch.nn.HingeEmbeddingLoss: Measures the loss given an input tensor xxx and a labels
  tensor yyy (containing 1 or -1). This is usually used for measuring whether two
  inputs are similar or dissimilar, e.g. using the L1 pairwise distance as xxx, and
  is typically used for learning nonlinear embeddings or semi-supervised learning.
torch.nn.HuberLoss: Creates a criterion that uses a squared term if the absolute element-wise
  error falls below delta and a delta-scaled L1 term otherwise. This loss combines
  advantages of both L1Loss and MSELoss; the delta-scaled L1 region makes the loss
  less sensitive to outliers than MSELoss, while the L2 region provides smoothness
  over L1Loss near 0. See Huber loss for more information.
torch.nn.Identity: A placeholder identity operator that is argument-insensitive.
torch.nn.InstanceNorm1d: 'Applies Instance Normalization over a 2D (unbatched) or
  3D (batched) input as described in the paper Instance Normalization: The Missing
  Ingredient for Fast Stylization.'
torch.nn.InstanceNorm2d: 'Applies Instance Normalization over a 4D input (a mini-batch
  of 2D inputs with additional channel dimension) as described in the paper Instance
  Normalization: The Missing Ingredient for Fast Stylization.'
torch.nn.InstanceNorm3d: 'Applies Instance Normalization over a 5D input (a mini-batch
  of 3D inputs with additional channel dimension) as described in the paper Instance
  Normalization: The Missing Ingredient for Fast Stylization.'
torch.nn.KLDivLoss: The Kullback-Leibler divergence loss.
torch.nn.L1Loss: Creates a criterion that measures the mean absolute error (MAE) between
  each element in the input xxx and target yyy.
torch.nn.LPPool1d: Applies a 1D power-average pooling over an input signal composed
  of several input planes.
torch.nn.LPPool2d: Applies a 2D power-average pooling over an input signal composed
  of several input planes.
torch.nn.LSTM: Applies a multi-layer long short-term memory (LSTM) RNN to an input
  sequence.
torch.nn.LSTMCell: A long short-term memory (LSTM) cell.
torch.nn.LayerNorm: Applies Layer Normalization over a mini-batch of inputs as described
  in the paper Layer Normalization
torch.nn.LazyBatchNorm1d: A torch.nn.BatchNorm1d module with lazy initialization of
  the num_features argument of the BatchNorm1d that is inferred from the input.size(1).
  The attributes that will be lazily initialized are weight, bias, running_mean and
  running_var.
torch.nn.LazyBatchNorm2d: A torch.nn.BatchNorm2d module with lazy initialization of
  the num_features argument of the BatchNorm2d that is inferred from the input.size(1).
  The attributes that will be lazily initialized are weight, bias, running_mean and
  running_var.
torch.nn.LazyBatchNorm3d: A torch.nn.BatchNorm3d module with lazy initialization of
  the num_features argument of the BatchNorm3d that is inferred from the input.size(1).
  The attributes that will be lazily initialized are weight, bias, running_mean and
  running_var.
torch.nn.LazyConv1d: A torch.nn.Conv1d module with lazy initialization of the in_channels
  argument of the Conv1d that is inferred from the input.size(1). The attributes that
  will be lazily initialized are weight and bias.
torch.nn.LazyConv2d: A torch.nn.Conv2d module with lazy initialization of the in_channels
  argument of the Conv2d that is inferred from the input.size(1). The attributes that
  will be lazily initialized are weight and bias.
torch.nn.LazyConv3d: A torch.nn.Conv3d module with lazy initialization of the in_channels
  argument of the Conv3d that is inferred from the input.size(1). The attributes that
  will be lazily initialized are weight and bias.
torch.nn.LazyConvTranspose1d: A torch.nn.ConvTranspose1d module with lazy initialization
  of the in_channels argument of the ConvTranspose1d that is inferred from the input.size(1).
  The attributes that will be lazily initialized are weight and bias.
torch.nn.LazyConvTranspose2d: A torch.nn.ConvTranspose2d module with lazy initialization
  of the in_channels argument of the ConvTranspose2d that is inferred from the input.size(1).
  The attributes that will be lazily initialized are weight and bias.
torch.nn.LazyConvTranspose3d: A torch.nn.ConvTranspose3d module with lazy initialization
  of the in_channels argument of the ConvTranspose3d that is inferred from the input.size(1).
  The attributes that will be lazily initialized are weight and bias.
torch.nn.LazyInstanceNorm1d: A torch.nn.InstanceNorm1d module with lazy initialization
  of the num_features argument of the InstanceNorm1d that is inferred from the input.size(1).
  The attributes that will be lazily initialized are weight, bias, running_mean and
  running_var.
torch.nn.LazyInstanceNorm2d: A torch.nn.InstanceNorm2d module with lazy initialization
  of the num_features argument of the InstanceNorm2d that is inferred from the input.size(1).
  The attributes that will be lazily initialized are weight, bias, running_mean and
  running_var.
torch.nn.LazyInstanceNorm3d: A torch.nn.InstanceNorm3d module with lazy initialization
  of the num_features argument of the InstanceNorm3d that is inferred from the input.size(1).
  The attributes that will be lazily initialized are weight, bias, running_mean and
  running_var.
torch.nn.LazyLinear: A torch.nn.Linear module where in_features is inferred.
torch.nn.LeakyReLU: 'Applies the element-wise function:'
torch.nn.Linear: 'Applies a linear transformation to the incoming data: y=xAT+by =
  xA^T + by=xAT+b'
torch.nn.LocalResponseNorm: Applies local response normalization over an input signal
