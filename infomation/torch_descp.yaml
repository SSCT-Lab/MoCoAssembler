  normalization across channels.
torch.nn.LogSigmoid: 'Applies the element-wise function:'
torch.nn.LogSoftmax: 'Applies the log⁡(Softmax(x))\log(\text{Softmax}(x))log(Softmax(x))
  function to an n-dimensional input Tensor. The LogSoftmax formulation can be simplified
