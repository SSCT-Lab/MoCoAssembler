torch.nn.PReLU: 'Applies the element-wise function:'
torch.nn.PairwiseDistance: Computes the pairwise distance between input vectors, or
  between columns of input matrices.
torch.nn.PixelShuffle: Rearranges elements in a tensor of shape (∗,C×r2,H,W)(*, C
  \times r^2, H, W)(∗,C×r2,H,W) to a tensor of shape (∗,C,H×r,W×r)(*, C, H \times
  r, W \times r)(∗,C,H×r,W×r), where r is an upscale factor.
torch.nn.PixelUnshuffle: Reverses the PixelShuffle operation by rearranging elements
  in a tensor of shape (∗,C,H×r,W×r)(*, C, H \times r, W \times r)(∗,C,H×r,W×r) to
  a tensor of shape (∗,C×r2,H,W)(*, C \times r^2, H, W)(∗,C×r2,H,W), where r is a
  downscale factor.
torch.nn.PoissonNLLLoss: Negative log likelihood loss with Poisson distribution of
  target.
torch.nn.RNN: Applies a multi-layer Elman RNN with tanh⁡\tanhtanh or ReLU\text{ReLU}ReLU
  non-linearity to an input sequence.
torch.nn.RNNBase: Resets parameter data pointer so that they can use faster code paths.
torch.nn.RNNCell: An Elman RNN cell with tanh or ReLU non-linearity.
torch.nn.RReLU: 'Applies the randomized leaky rectified liner unit function, element-wise,
  as described in the paper:'
torch.nn.ReLU: 'Applies the rectified linear unit function element-wise:'
torch.nn.ReLU6: 'Applies the element-wise function:'
torch.nn.ReflectionPad1d: Pads the input tensor using the reflection of the input
  boundary.
torch.nn.ReflectionPad2d: Pads the input tensor using the reflection of the input
  boundary.
torch.nn.ReflectionPad3d: Pads the input tensor using the reflection of the input
  boundary.
torch.nn.ReplicationPad1d: Pads the input tensor using replication of the input boundary.
torch.nn.ReplicationPad2d: Pads the input tensor using replication of the input boundary.
torch.nn.ReplicationPad3d: Pads the input tensor using replication of the input boundary.
torch.nn.SELU: 'Applied element-wise, as:'
torch.nn.SiLU: Applies the Sigmoid Linear Unit (SiLU) function, element-wise. The
  SiLU function is also known as the swish function.
torch.nn.Sigmoid: 'Applies the element-wise function:'
torch.nn.SmoothL1Loss: Creates a criterion that uses a squared term if the absolute
  element-wise error falls below beta and an L1 term otherwise. It is less sensitive
  to outliers than torch.nn.MSELoss and in some cases prevents exploding gradients
  (e.g. see the paper Fast R-CNN by Ross Girshick).
torch.nn.SoftMarginLoss: Creates a criterion that optimizes a two-class classification
  logistic loss between input tensor xxx and target tensor yyy (containing 1 or -1).
torch.nn.Softmax: Applies the Softmax function to an n-dimensional input Tensor rescaling
  them so that the elements of the n-dimensional output Tensor lie in the range [0,1]
  and sum to 1.
torch.nn.Softmax2d: Applies SoftMax over features to each spatial location.
torch.nn.Softmin: Applies the Softmin function to an n-dimensional input Tensor rescaling
  them so that the elements of the n-dimensional output Tensor lie in the range [0,
  1] and sum to 1.
torch.nn.Softplus: Applies the Softplus function Softplus(x)=1β∗log⁡(1+exp⁡(β∗x))\text{Softplus}(x)
  = \frac{1}{\beta} * \log(1 + \exp(\beta * x))Softplus(x)=β1​∗log(1+exp(β∗x)) element-wise.
torch.nn.Softshrink: 'Applies the soft shrinkage function elementwise:'
torch.nn.Softsign: 'Applies the element-wise function:'
torch.nn.SyncBatchNorm: 'Applies Batch Normalization over a N-Dimensional input (a
  mini-batch of [N-2]D inputs with additional channel dimension) as described in the
  paper Batch Normalization: Accelerating Deep Network Training by Reducing Internal
  Covariate Shift .'
torch.nn.Tanh: Applies the Hyperbolic Tangent (Tanh) function element-wise.
torch.nn.Tanhshrink: 'Applies the element-wise function:'
torch.nn.Threshold: Thresholds each element of the input Tensor.
torch.nn.Transformer: A transformer model. User is able to modify the attributes as
  needed. The architecture is based on the paper “Attention Is All You Need”. Ashish
  Vaswani, Noam Shazeer, Niki Parmar, Jakob Uszkoreit, Llion Jones, Aidan N Gomez,
  Lukasz Kaiser, and Illia Polosukhin. 2017. Attention is all you need. In Advances
  in Neural Information Processing Systems, pages 6000-6010.
torch.nn.TransformerDecoder: TransformerDecoder is a stack of N decoder layers
torch.nn.TransformerDecoderLayer: TransformerDecoderLayer is made up of self-attn,
  multi-head-attn and feedforward network. This standard decoder layer is based on
  the paper “Attention Is All You Need”. Ashish Vaswani, Noam Shazeer, Niki Parmar,
  Jakob Uszkoreit, Llion Jones, Aidan N Gomez, Lukasz Kaiser, and Illia Polosukhin.
  2017. Attention is all you need. In Advances in Neural Information Processing Systems,
  pages 6000-6010. Users may modify or implement in a different way during application.
torch.nn.TransformerEncoder: TransformerEncoder is a stack of N encoder layers. Users
  can build the BERT(https://arxiv.org/abs/1810.04805) model with corresponding parameters.
torch.nn.TransformerEncoderLayer: TransformerEncoderLayer is made up of self-attn
  and feedforward network. This standard encoder layer is based on the paper “Attention
  Is All You Need”. Ashish Vaswani, Noam Shazeer, Niki Parmar, Jakob Uszkoreit, Llion
  Jones, Aidan N Gomez, Lukasz Kaiser, and Illia Polosukhin. 2017. Attention is all
  you need. In Advances in Neural Information Processing Systems, pages 6000-6010.
  Users may modify or implement in a different way during application.
torch.nn.TripletMarginLoss: Creates a criterion that measures the triplet loss given
  an input tensors x1x1x1, x2x2x2, x3x3x3 and a margin with a value greater than 000.
  This is used for measuring a relative similarity between samples. A triplet is composed
  by a, p and n (i.e., anchor, positive examples and negative examples respectively).
  The shapes of all input tensors should be (N,D)(N, D)(N,D).
torch.nn.TripletMarginWithDistanceLoss: Creates a criterion that measures the triplet
  loss given input tensors aaa, ppp, and nnn (representing anchor, positive, and negative
  examples, respectively), and a nonnegative, real-valued function (“distance function”)
  used to compute the relationship between the anchor and positive example (“positive
  distance”) and the anchor and negative example (“negative distance”).
torch.nn.Unflatten: Unflattens a tensor dim expanding it to a desired shape. For use
  with Sequential.
torch.nn.Unfold: Extracts sliding local blocks from a batched input tensor.
torch.nn.Upsample: Upsamples a given multi-channel 1D (temporal), 2D (spatial) or
  3D (volumetric) data.
torch.nn.UpsamplingBilinear2d: Applies a 2D bilinear upsampling to an input signal
  composed of several input channels.
torch.nn.UpsamplingNearest2d: Applies a 2D nearest neighbor upsampling to an input
  signal composed of several input channels.
torch.nn.ZeroPad2d: Pads the input tensor boundaries with zero.
torch.nn.modules.lazy.LazyModuleMixin: A mixin for modules that lazily initialize
  parameters, also known as “lazy modules.”
torch.nn.parallel.DistributedDataParallel: Implements distributed data parallelism
  that is based on torch.distributed package at the module level.
torch.nn.utils.clip_grad_norm_: Clips gradient norm of an iterable of parameters.
torch.nn.utils.clip_grad_value_: Clips gradient of an iterable of parameters at specified
  value.
torch.nn.utils.parameters_to_vector: Convert parameters to one vector
torch.nn.utils.parametrizations.orthogonal: Applies an orthogonal or unitary parametrization
  to a matrix or a batch of matrices.
torch.nn.utils.parametrizations.spectral_norm: Applies spectral normalization to a
  parameter in the given module.
torch.nn.utils.parametrize.ParametrizationList: A sequential container that holds
  and manages the original or original0, original1, … parameters or buffers of a parametrized
  torch.nn.Module.
torch.nn.utils.parametrize.cached: Context manager that enables the caching system
  within parametrizations registered with register_parametrization().
torch.nn.utils.parametrize.is_parametrized: Returns True if module has an active parametrization.
torch.nn.utils.parametrize.register_parametrization: Adds a parametrization to a tensor
  in a module.
torch.nn.utils.parametrize.remove_parametrizations: Removes the parametrizations on
  a tensor in a module.
torch.nn.utils.prune.BasePruningMethod: Abstract base class for creation of new pruning
  techniques.
torch.nn.utils.prune.CustomFromMask: Adds the forward pre-hook that enables pruning
  on the fly and the reparametrization of a tensor in terms of the original tensor
  and the pruning mask.
torch.nn.utils.prune.Identity: 'Applies pruning reparametrization to the tensor corresponding
  to the parameter called name in module without actually pruning any units. Modifies
  module in place (and also return the modified module) by:'
torch.nn.utils.prune.L1Unstructured: Prune (currently unpruned) units in a tensor
  by zeroing out the ones with the lowest L1-norm.
torch.nn.utils.prune.LnStructured: Prune entire (currently unpruned) channels in a
  tensor based on their Ln-norm.
torch.nn.utils.prune.PruningContainer: Container holding a sequence of pruning methods
  for iterative pruning. Keeps track of the order in which pruning methods are applied
  and handles combining successive pruning calls.
torch.nn.utils.prune.RandomStructured: Prune entire (currently unpruned) channels
  in a tensor at random.
torch.nn.utils.prune.RandomUnstructured: Prune (currently unpruned) units in a tensor
  at random.
torch.nn.utils.prune.custom_from_mask: 'Prunes tensor corresponding to parameter called
  name in module by applying the pre-computed mask in mask. Modifies module in place
  (and also return the modified module) by:'
torch.nn.utils.prune.global_unstructured: 'Globally prunes tensors corresponding to
  all parameters in parameters by applying the specified pruning_method. Modifies
  modules in place by:'
torch.nn.utils.prune.is_pruned: Check whether module is pruned by looking for forward_pre_hooks
  in its modules that inherit from the BasePruningMethod.
torch.nn.utils.prune.l1_unstructured: 'Prunes tensor corresponding to parameter called
  name in module by removing the specified amount of (currently unpruned) units with
  the lowest L1-norm. Modifies module in place (and also return the modified module)
  by:'
torch.nn.utils.prune.ln_structured: 'Prunes tensor corresponding to parameter called
  name in module by removing the specified amount of (currently unpruned) channels
  along the specified dim with the lowest Ln-norm. Modifies module in place (and also
  return the modified module) by:'
torch.nn.utils.prune.random_structured: 'Prunes tensor corresponding to parameter
  called name in module by removing the specified amount of (currently unpruned) channels
  along the specified dim selected at random. Modifies module in place (and also return
  the modified module) by:'
torch.nn.utils.prune.random_unstructured: 'Prunes tensor corresponding to parameter
  called name in module by removing the specified amount of (currently unpruned) units
  selected at random. Modifies module in place (and also return the modified module)
  by:'
torch.nn.utils.prune.remove: Removes the pruning reparameterization from a module
  and the pruning method from the forward hook. The pruned parameter named name remains
  permanently pruned, and the parameter named name+'_orig' is removed from the parameter
  list. Similarly, the buffer named name+'_mask' is removed from the buffers.
torch.nn.utils.remove_spectral_norm: Removes the spectral normalization reparameterization
  from a module.
torch.nn.utils.remove_weight_norm: Removes the weight normalization reparameterization
  from a module.
torch.nn.utils.rnn.PackedSequence: Holds the data and list of batch_sizes of a packed
  sequence.
torch.nn.utils.rnn.pack_padded_sequence: Packs a Tensor containing padded sequences
  of variable length.
torch.nn.utils.rnn.pack_sequence: Packs a list of variable length Tensors
torch.nn.utils.rnn.pad_packed_sequence: Pads a packed batch of variable length sequences.
torch.nn.utils.rnn.pad_sequence: Pad a list of variable length Tensors with padding_value
torch.nn.utils.rnn.unpack_sequence: Unpacks PackedSequence into a list of variable
  length Tensors
torch.nn.utils.rnn.unpad_sequence: Unpad padded Tensor into a list of variable length
  Tensors
torch.nn.utils.skip_init: 'Given a module class object and args / kwargs, instantiates
  the module without initializing parameters / buffers.  This can be useful if initialization
  is slow or if custom initialization will be performed, making the default initialization
  unnecessary. There are some caveats to this, due to the way this function is implemented:'
torch.nn.utils.spectral_norm: Applies spectral normalization to a parameter in the
  given module.
torch.nn.utils.stateless.functional_call: Performs a functional call on the module
  by replacing the module parameters and buffers with the provided ones.
torch.nn.utils.vector_to_parameters: Convert one vector to the parameters
torch.nn.utils.weight_norm: Applies weight normalization to a parameter in the given
  module.
