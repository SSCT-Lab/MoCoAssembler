  Tensor yyy (containing 1 or -1).
torch.nn.MaxPool1d: Applies a 1D max pooling over an input signal composed of several
  input planes.
torch.nn.MaxPool2d: Applies a 2D max pooling over an input signal composed of several
  input planes.
torch.nn.MaxPool3d: Applies a 3D max pooling over an input signal composed of several
  input planes.
torch.nn.MaxUnpool1d: Computes a partial inverse of MaxPool1d.
torch.nn.MaxUnpool2d: Computes a partial inverse of MaxPool2d.
torch.nn.MaxUnpool3d: Computes a partial inverse of MaxPool3d.
torch.nn.Mish: 'Applies the Mish function, element-wise. Mish: A Self Regularized
  Non-Monotonic Neural Activation Function.'
torch.nn.MultiLabelMarginLoss: 'Creates a criterion that optimizes a multi-class multi-classification
  hinge loss (margin-based loss) between input xxx (a 2D mini-batch Tensor) and output
  yyy (which is a 2D Tensor of target class indices). For each sample in the mini-batch:'
torch.nn.MultiLabelSoftMarginLoss: 'Creates a criterion that optimizes a multi-label
  one-versus-all loss based on max-entropy, between input xxx and target yyy of size
  (N,C)(N, C)(N,C). For each sample in the minibatch:'
torch.nn.MultiMarginLoss: 'Creates a criterion that optimizes a multi-class classification
  hinge loss (margin-based loss) between input xxx (a 2D mini-batch Tensor) and output
  yyy (which is a 1D tensor of target class indices, 0≤y≤x.size(1)−10 \leq y \leq
  \text{x.size}(1)-10≤y≤x.size(1)−1):'
torch.nn.MultiheadAttention: 'Allows the model to jointly attend to information from
  different representation subspaces as described in the paper: Attention Is All You
  Need.'
torch.nn.NLLLoss: The negative log likelihood loss. It is useful to train a classification
